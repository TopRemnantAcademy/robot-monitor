# RobotMonitor CNB NPC 配置
# 两种触发：
#  A) Issue/PR 评论 @mention（NPC 模式）：在 Issue 评论里写 @flow.237/RobotMonitor(开发工程师) 派工
#  B) crontab 自主流水线（常规模式）：每天 0/6/12/18 点跑 7 段，读 spec/ci/*-call.md 执行
include:
  - https://cnb.cool/Bring/Agents/Agent/-/blob/main/npc.yml

$:
  # 【临时·订单18】把 contract-gate 的 stages 镜像到 api_trigger，
  # 用 `cnb build start-build --event api_trigger` 真机验证命令能过。
  # **验证完必须删除本块**。
  # 【临时·订单18】环境探针
  # 【临时·订单18】pip 引导方式探针
  api_trigger:
    probe-pip:
      docker:
        image: node:20
      stages:
        - name: probe-pip
          script: |
            echo "--- ensurepip ---"
            python3 -m ensurepip --version 2>&1 || echo "ensurepip FAILED"
            python3 -m ensurepip --upgrade 2>&1 | tail -3
            python3 -m pip --version 2>&1 || echo "pip still missing"

  issue:
    comment@npc:
      image: cnbcool/default-npc:latest
      settings:
        max_turns: 200
        workspace_preflight: on
  pull_request:
    comment@npc:
      image: cnbcool/default-npc:latest
      settings:
        max_turns: 200
        workspace_preflight: on

    # -----------------------------------------------------------------------
    # 订单 18 T2 —— 契约门禁（契约即代码）
    #
    # **刻意不做 `|| true` / `continue-on-error` 兜底**：门禁能被吞掉就等于不存在。
    # 两道判定都必须让构建变红：
    #   ① generated-types-must-be-committed —— api.gen.ts 与 openapi.snapshot.json 不同步；
    #   ② contract-snapshot-check           —— 后端删字段/改类型但没同步快照（breaking）。
    # 依据：本仓已真实翻车过一次（STATUS.md §六第 2 条 —— `/history` 漏 `joint_positions`
    # 导致 Drawer 第三条折线恒空）。那次是"人眼比对通过"的，机器一跑就现形。
    #
    # 用对象形式声明（`contract-gate:` 是流水线标识），与 NPC 的 `comment@npc:` 平级。
    # 依据：语法手册「也支持通过对象的形式声明多个流水线」（docs.cnb.cool/zh/build/grammar.md）。
    #
    # 为什么用 node:20 而不是 cnbcool/default-npc：
    #   门禁横跨两侧 —— 前端要 Node（openapi-typescript / tsc / node --test），
    #   契约导出要 Python（`import app.main` 取 `app.openapi()`）。
    #   node:20 全量镜像自带 python3 与 pip，一次满足两侧；
    #   依赖装在 --user，不碰系统 site-packages，也不需要 root。
    #
    # ⚠️ 踩坑记录：CNB 的 `script` 由 **sh(dash)** 执行，不是 bash。
    #   `set -euo pipefail` 会报 `sh: 1: set: Illegal option -o pipefail` 并让 stage
    #   exit 2（本单实测：构建 cnb-lof-1k4k3unge 的 probe stage）。
    #   本文件统一用 POSIX 安全的 `set -eu`，**不要**加回 pipefail。
    # -----------------------------------------------------------------------
    contract-gate:
      docker:
        image: node:20
      env:
        JWT_SECRET: ci-openapi-export-placeholder
      stages:
        - name: prepare-backend-deps
          script: |
            set -eu
            python3 -m pip install --user --quiet --disable-pip-version-check \\
              -r backend_ingestion/requirements.txt
            python3 -c "import fastapi, pydantic; print('backend deps ok:', fastapi.__version__, pydantic.VERSION)"
        - name: contract-snapshot-check
          script: |
            set -eu
            python3 scripts/export-openapi.py --check docs/contracts/openapi.snapshot.json
        - name: prepare-frontend-deps
          script: |
            set -eu
            cd frontend_dashboard
            npm ci --no-audit --fund=false
        - name: generated-types-must-be-committed
          script: |
            set -eu
            cd frontend_dashboard
            npm run gen:types
            cd ..
            git diff --exit-code -- frontend_dashboard/src/types/api.gen.ts
        - name: ws-envelope-contract
          script: |
            set -eu
            cd frontend_dashboard
            node --test "tests/*.test.mjs"
        - name: typecheck
          script: |
            set -eu
            cd frontend_dashboard
            npx tsc --noEmit

main:
  "crontab: 0 0,6,12,18 * * *":
    - stages:
        - name: pm-call
          image: docker.cnb.cool/bring/agents/agent:latest
          settings:
            max_turns: 30
            workspace_preflight: on
            system_prompt: |
              你是本仓库 RobotMonitor 的产品经理。严格遵守 AGENTS.md 全局纪律。
              你的身份与职责见 .cnb/settings.yml 中「产品经理」角色定义。
            user_prompt: |
              定时巡检。先用 bash 读取 ./spec/ci/pm-call.md，严格按其程序、禁止事项、产出格式执行，不要自创流程。

        - name: architect-call
          image: docker.cnb.cool/bring/agents/agent:latest
          settings:
            max_turns: 40
            workspace_preflight: on
            system_prompt: |
              你是本仓库 RobotMonitor 的架构师。严格遵守 AGENTS.md 全局纪律。
              你的身份与职责见 .cnb/settings.yml 中「架构师」角色定义。
            user_prompt: |
              定时巡检。先用 bash 读取 ./spec/ci/architect-call.md，严格按其程序执行，不要自创流程。

        - name: dev-call
          image: docker.cnb.cool/bring/agents/agent:latest
          settings:
            max_turns: 120
            workspace_preflight: on
            system_prompt: |
              你是本仓库 RobotMonitor 的开发工程师。严格遵守 AGENTS.md 全局纪律（无幻觉/完整可运行/性能护栏/数据契约）。
              你的身份与职责见 .cnb/settings.yml 中「开发工程师」角色定义。
            user_prompt: |
              定时巡检。先用 bash 读取 ./spec/ci/dev-call.md，严格按其程序执行，不要自创流程。

        - name: review-call
          image: docker.cnb.cool/bring/agents/agent:latest
          settings:
            max_turns: 60
            workspace_preflight: on
            system_prompt: |
              你是本仓库 RobotMonitor 的代码审查工程师。严格遵守 AGENTS.md 全局纪律。
              你的身份与职责见 .cnb/settings.yml 中「代码审查」角色定义。
            user_prompt: |
              定时巡检。先用 bash 读取 ./spec/ci/review-call.md，严格按其程序执行，不要自创流程。

        - name: test-call
          image: docker.cnb.cool/bring/agents/agent:latest
          settings:
            max_turns: 60
            workspace_preflight: on
            system_prompt: |
              你是本仓库 RobotMonitor 的测试工程师。严格遵守 AGENTS.md 全局纪律。
              你的身份与职责见 .cnb/settings.yml 中「测试工程师」角色定义。
            user_prompt: |
              定时巡检。先用 bash 读取 ./spec/ci/test-call.md，严格按其程序执行，不要自创流程。

        - name: compliance-call
          image: docker.cnb.cool/bring/agents/agent:latest
          settings:
            max_turns: 30
            workspace_preflight: on
            system_prompt: |
              你是本仓库 RobotMonitor 的合规门禁。严格遵守 AGENTS.md 全局纪律。
              你的身份与职责见 .cnb/settings.yml 中「合规」角色定义。
            user_prompt: |
              定时巡检。先用 bash 读取 ./spec/ci/compliance-call.md，严格按其程序执行，不要自创流程。

        - name: integration-call
          image: docker.cnb.cool/bring/agents/agent:latest
          settings:
            max_turns: 60
            workspace_preflight: on
            system_prompt: |
              你是本仓库 RobotMonitor 的测试/集成工程师。严格遵守 AGENTS.md 全局纪律。
              负责端到端联调：docker-compose 起栈 + 后端 + 告警引擎 + 模拟器压测 30s + 校验写入与告警。
            user_prompt: |
              定时巡检。先用 bash 读取 ./spec/ci/integration-call.md，严格按其程序执行，不要自创流程。

# RobotMonitor CNB NPC 配置
# 两种触发：
#  A) Issue/PR 评论 @mention（NPC 模式）：在 Issue 评论里写 @flow.237/RobotMonitor(开发工程师) 派工
#  B) crontab 自主流水线（常规模式）：每天 0/6/12/18 点跑 7 段，读 spec/ci/*-call.md 执行
include:
  - https://cnb.cool/Bring/Agents/Agent/-/blob/main/npc.yml

$:
  issue:
    comment@npc:
      image: cnbcool/default-npc:latest
      settings:
        max_turns: 200
        workspace_preflight: on
  pull_request:
    comment@npc:
      image: cnbcool/default-npc:latest
      settings:
        max_turns: 200
        workspace_preflight: on

main:
  "crontab: 0 0,6,12,18 * * *":
    - stages:
        - name: pm-call
          image: docker.cnb.cool/bring/agents/agent:latest
          settings:
            max_turns: 30
            workspace_preflight: on
            system_prompt: |
              你是本仓库 RobotMonitor 的产品经理。严格遵守 AGENTS.md 全局纪律。
              你的身份与职责见 .cnb/settings.yml 中「产品经理」角色定义。
            user_prompt: |
              定时巡检。先用 bash 读取 ./spec/ci/pm-call.md，严格按其程序、禁止事项、产出格式执行，不要自创流程。

        - name: architect-call
          image: docker.cnb.cool/bring/agents/agent:latest
          settings:
            max_turns: 40
            workspace_preflight: on
            system_prompt: |
              你是本仓库 RobotMonitor 的架构师。严格遵守 AGENTS.md 全局纪律。
              你的身份与职责见 .cnb/settings.yml 中「架构师」角色定义。
            user_prompt: |
              定时巡检。先用 bash 读取 ./spec/ci/architect-call.md，严格按其程序执行，不要自创流程。

        - name: dev-call
          image: docker.cnb.cool/bring/agents/agent:latest
          settings:
            max_turns: 120
            workspace_preflight: on
            system_prompt: |
              你是本仓库 RobotMonitor 的开发工程师。严格遵守 AGENTS.md 全局纪律（无幻觉/完整可运行/性能护栏/数据契约）。
              你的身份与职责见 .cnb/settings.yml 中「开发工程师」角色定义。
            user_prompt: |
              定时巡检。先用 bash 读取 ./spec/ci/dev-call.md，严格按其程序执行，不要自创流程。

        - name: review-call
          image: docker.cnb.cool/bring/agents/agent:latest
          settings:
            max_turns: 60
            workspace_preflight: on
            system_prompt: |
              你是本仓库 RobotMonitor 的代码审查工程师。严格遵守 AGENTS.md 全局纪律。
              你的身份与职责见 .cnb/settings.yml 中「代码审查」角色定义。
            user_prompt: |
              定时巡检。先用 bash 读取 ./spec/ci/review-call.md，严格按其程序执行，不要自创流程。

        - name: test-call
          image: docker.cnb.cool/bring/agents/agent:latest
          settings:
            max_turns: 60
            workspace_preflight: on
            system_prompt: |
              你是本仓库 RobotMonitor 的测试工程师。严格遵守 AGENTS.md 全局纪律。
              你的身份与职责见 .cnb/settings.yml 中「测试工程师」角色定义。
            user_prompt: |
              定时巡检。先用 bash 读取 ./spec/ci/test-call.md，严格按其程序执行，不要自创流程。

        - name: compliance-call
          image: docker.cnb.cool/bring/agents/agent:latest
          settings:
            max_turns: 30
            workspace_preflight: on
            system_prompt: |
              你是本仓库 RobotMonitor 的合规门禁。严格遵守 AGENTS.md 全局纪律。
              你的身份与职责见 .cnb/settings.yml 中「合规」角色定义。
            user_prompt: |
              定时巡检。先用 bash 读取 ./spec/ci/compliance-call.md，严格按其程序执行，不要自创流程。

        - name: integration-call
          image: docker.cnb.cool/bring/agents/agent:latest
          settings:
            max_turns: 60
            workspace_preflight: on
            system_prompt: |
              你是本仓库 RobotMonitor 的测试/集成工程师。严格遵守 AGENTS.md 全局纪律。
              负责端到端联调：docker-compose 起栈 + 后端 + 告警引擎 + 模拟器压测 30s + 校验写入与告警。
            user_prompt: |
              定时巡检。先用 bash 读取 ./spec/ci/integration-call.md，严格按其程序执行，不要自创流程。

  # ============================================================
  # e2e：端到端 30,000 行落库验证（ISSUE #60）
  #
  # 为什么单独一条 pipeline：它需要 **Docker-in-Docker**（services: [docker]）
  # 才能起 emqx + timescaledb:2.13.1 + redis + backend + mock_fleet。
  # CNB 的默认构建机不一定提供可用 docker daemon，所以这一条**必须**
  # 在缺失时「明确 skip」而不是红 —— 否则环境问题会被误读成代码回归
  # （ISSUE #60 §4、AGENTS.md §6 都要求区分「环境」与「代码」）。
  #
  # 判定与产出：起栈前先探 docker、再探 python；缺任一则打印【E2E SKIP】原因并以 0 退出。
  # 构建镜像必须自带 python3（实跑发现缺省镜像没有，见 pipeline 内注释）。
  # 可用则跑 tests/e2e/test_e2e_30k.py（自带超时守卫与取证报告），
  # 退出码 3 视同 skip（脚本内部已判过环境），其余非 0 才是真失败。
  #
  # 触发面：PR（拦回归）+ push main（合入后复核）+ 每日 crontab（漂移巡检）
  # 共用同一份 stages 定义（锚点 &e2e-stages），避免三处脚本各自演化。
  # ============================================================
  pull_request:
    - name: e2e-30k-landing
      # ---- 为什么必须钉 image（2026-10 CI 实测教训）----
      # 不写 image 时用缺省镜像 `cnbcool/default-build-env`，该镜像**没有 python3**：
      # 首次实跑报 `sh: line 21: python3: command not found`（返回码 127），
      # 而此时 docker 探测已经通过（日志里的 `docker 可用：Docker version 29.6.2`），
      # 即「环境判定全绿 → 脚本起不来」，属于最坏的一类失败（红得莫名其妙）。
      # 所以这里把运行环境写死成有 python3 的镜像，而不是靠默认镜像碰运气。
      # 同理，脚本里也**不再**用 `python3` 裸命令，见下方 runner 探测。
      docker:
        image: python:3.11-slim
      services: [docker]
      env: &e2e-env
        # 40s × 100 台 × 10Hz ≈ 40,000 帧，相对 30,000 阈值留足余量。
        E2E_DURATION: "40"
        E2E_ROBOTS: "100"
        E2E_MIN_ROWS: "30000"
      stages: &e2e-stages
        - name: e2e
          script: |
            set -uo pipefail
            echo "== e2e 30k 落库验证（ISSUE #60）=="

            # ---- 环境判定：无 Docker 即明确 skip，绝不 red ----
            if ! command -v docker >/dev/null 2>&1; then
              echo "【E2E SKIP】PATH 内找不到 docker 命令。"
              echo "本 job 需要真实 Docker（emqx + timescaledb:2.13.1 + redis + backend + mock_fleet），"
              echo "且 ISSUE #60 禁止用 mock 替身冒充真实 TimescaleDB。"
              echo "需要：在提供 docker 的构建机/自托管 runner 上运行本 job，或本地执行"
              echo "  python -m pytest tests/e2e/test_e2e_30k.py -v -s"
              exit 0
            fi
            if ! docker info >/dev/null 2>&1; then
              echo "【E2E SKIP】docker daemon 不可达（docker info 非 0）。原始输出（尾部）："
              docker info 2>&1 | tail -5 || true
              exit 0
            fi
            echo "docker 可用：$(docker --version)"

            # ---- 运行环境判定：连 python 都没有就明确 skip，绝不 red ----
            # 这一层是实跑打出来的：首次 CI 里 docker 可用，但缺省镜像无 python3，
            # 脚本根本没起来（返回码 127）。所以顺序必须是
            # 「先探 docker（本 job 的核心依赖）→ 再探 python（脚本自身的依赖）」，
            # 两层都给出原因与解法，读者不必翻配置就知道卡在哪一层。
            if command -v python3 >/dev/null 2>&1; then
              PY=python3
            elif command -v python >/dev/null 2>&1; then
              PY=python
            else
              echo "【E2E SKIP】镜像内 PATH 找不到 python3/python（当前镜像：${CNB_BUILD_IMAGE:-缺省镜像}）。"
              echo "本 job 需要 python 来驱动 tests/e2e/test_e2e_30k.py（只用标准库，无需 pip 安装）。"
              echo "修复：在本 pipeline 上声明 docker.image（如 python:3.11-slim），不要沿用缺省镜像。"
              exit 0
            fi
            echo "python 可用：$($PY --version 2>&1)"

            # 依赖：e2e 脚本只用标准库（subprocess/urllib），无需 pip 安装。
            $PY tests/e2e/test_e2e_30k.py
            rc=$?
            if [ "$rc" = "3" ]; then
              echo "【E2E SKIP】脚本自判环境不具备（退出码 3），非代码失败。"
              exit 0
            fi
            exit "$rc"

  push:
    - name: e2e-30k-landing
      services: [docker]
      env: *e2e-env
      stages: *e2e-stages

  "crontab: 0 3 * * *":
    - name: e2e-30k-landing
      services: [docker]
      env: *e2e-env
      stages: *e2e-stages

# RobotMonitor CNB NPC 配置
# 两种触发：
#  A) Issue/PR 评论 @mention（NPC 模式）：在 Issue 评论里写 @flow.237/RobotMonitor(开发工程师) 派工
#  B) crontab 自主流水线（常规模式）：每天 0/6/12/18 点跑 7 段，读 spec/ci/*-call.md 执行
include:
  - https://cnb.cool/Bring/Agents/Agent/-/blob/main/npc.yml

$:
  issue:
    comment@npc:
      image: cnbcool/default-npc:latest
      settings:
        max_turns: 200
        workspace_preflight: on
  pull_request:
    comment@npc:
      image: cnbcool/default-npc:latest
      settings:
        max_turns: 200
        workspace_preflight: on

    # -----------------------------------------------------------------------
    # 订单 18 T2 —— 契约门禁（契约即代码）
    #
    # **刻意不做 `|| true` / `continue-on-error` 兜底**：门禁能被吞掉就等于不存在。
    # 两步判定都必须让构建变红：
    #   ① generated-types-must-be-committed —— api.gen.ts 与 openapi.snapshot.json 不同步
    #   ② contract-snapshot-check           —— 后端删字段/改类型但没同步快照（breaking）
    # 依据：本仓已真实翻车过一次（STATUS.md §六第 2 条 —— `/history` 漏 `joint_positions`
    # 导致 Drawer 第三条折线恒空）。那次是"人眼比对通过"的，机器一跑就现形。
    #
    # 用对象形式声明（`contract-gate:` 是流水线标识），与 NPC 的 `comment@npc:` 平级；
    # 依据：语法手册「也支持通过对象的形式声明多个流水线」。
    #
    # 镜像用 `ci/contract-gate.Dockerfile` 而非裸 node:20 —— 实测 node:20 的 python3
    # **没有 pip 也没有 ensurepip**（见该 Dockerfile 顶部记录），依赖必须在镜像构建期装好。
    # 全部逻辑收进 `ci/contract-gate.sh`（POSIX sh），避免几十行内联脚本难维护。
    # -----------------------------------------------------------------------
    contract-gate:
      docker:
        build:
          dockerfile: ci/contract-gate.Dockerfile
          by:
            - ci/contract-gate.Dockerfile
            - backend_ingestion/requirements.txt
            # `by` 是 Dockerfile 可 COPY 文件的**白名单**，未列出的文件不进构建上下文
            # （官方 grammar.md 明确警告）。这 3 个文件必须与 ci/contract-gate.Dockerfile
            # 里的 COPY 严格对应，少列一个 → 构建直接
            # `failed to calculate checksum ... not found`
            # （实测：缺 package.json 时构建 cnb-jgf-1k4k4c9db 死在这一步）。
            - frontend_dashboard/package.json
            - frontend_dashboard/package-lock.json
      env:
        # 只为让 `Settings()` 在 import 期实例化成功（jwt_secret 无默认值）。
        # 是占位串，不参与任何签名；真实密钥绝不入仓（AGENTS.md §5）。
        JWT_SECRET: ci-openapi-export-placeholder
      stages:
        - name: contract-gate
          script: sh ci/contract-gate.sh

main:
  # ── 订单 24 T3：测试门禁 ─────────────────────────────────────────────
  # 目的：把 STATUS.md 里手写的「11/11」「20/20」「25 passed」变成 CI 可复现数字。
  # 失败即红：任何一步非 0 退出都会中断 stages 并置流水线为 error ——
  # 全程**禁止** `|| true` / `continue-on-error`（订单 24 §4.2）。
  #
  # ⚠️ 关于 stage 的 shell（本文件曾因此 CI 红）：CNB 用 `sh`（dash）执行 script，
  #   dash **不支持** `set -o pipefail`；用 `set -eu` 即可。
  # ⚠️ 关于 `pytest` 的 testpaths（pytest.ini，订单 24 §4.1 禁止修改）：
  #   `pytest`（裸跑）走 testpaths = tests + alert_engine/tests；
  #   `backend_ingestion/tests` 刻意**不在**其内，故单独一条命令跑。
  push:
    - name: test
      docker:
        image: python:3.11
      stages:
        - name: pytest
          script: |
            set -eu
            # tests/load/test_payload_contract.py 需要 node 实跑 payload.js 取样例报文
            # （订单 23 契约：payload 复用 mock_fleet 真实 24 关节结构，漏跑=契约裸奔）。
            # python:3.11 镜像无 node；Debian bookworm 的 nodejs 18 支持 --input-type=module。
            # 2026-10-11 首次实跑（CI 修复后）实证：3 failed, 68 passed —— 失败全因缺 node。
            apt-get update -qq && apt-get install -y -qq --no-install-recommends nodejs >/dev/null
            node --version
            python -m pip install --no-cache-dir -r alert_engine/requirements.txt
            python -m pip install --no-cache-dir -r backend_ingestion/requirements.txt
            # fakeredis 是**测试期**依赖：订单 04 的验收用例要验去重器的 SET NX 幂等
            # 与 TTL，进程内 dict 替身测不出 Redis 服务端语义。
            python -m pip install --no-cache-dir pytest pytest-timeout 'httpx<0.28' fakeredis
            # rich 是 tests/test_ts_sampling.py 间接需要的**测试期**依赖：该文件要 exec
            # simulator/mock_fleet.py，而后者在 :41 `from rich.console import Console`。
            # 上面两个 requirements 都**不含** rich（simulator 的依赖不入 CI）。
            #
            # 测试侧已能把「缺依赖」判为 SKIP（见 tests/test_ts_sampling.py 的
            # Skip/_PytestSkipped），所以**不装也不会红**。这里仍然补装，是因为
            # 「跳过」和「跑过」不是一回事：这 3 个用例盯的是 PK (time, robot_id)
            # 的毫秒时间戳唯一性（ON CONFLICT DO NOTHING 会静默丢行），
            # 长年 SKIP 等于门禁不存在。补装后它们在 CI 真跑。
            # 版本与 simulator/requirements.txt 对齐，避免「本机能跑、CI 不能跑」。
            python -m pip install --no-cache-dir rich==13.7.1
            echo "── pytest（仓库根，testpaths = tests + alert_engine/tests）──"
            python -m pytest -q
            echo "── pytest backend_ingestion/tests（顶层 app 包冲突，单独跑）──"
            # 2026-10-11 实测：backend 套件一例 F 后整体挂死 10.8m 被 runner SIGKILL，
            # F 的名字与栈都没打出来。加 pytest-timeout（单测 60s 封顶，超时打栈）
            # 与 -v（挂死时日志至少留有「最后一个开跑的用例」），一次跑出可定位现场。
            python -m pytest backend_ingestion/tests/ -v --timeout=60

            # ── 2026-10-13 追加三道门禁（此前只在主代理本机手验，现已固化）──
            # ① 全量语法编译：抓「测试收集不到、因此从没人发现」的语法错。
            #    本机实测 rc=0（backend_ingestion/app + alert_engine/app + simulator + tests）。
            echo "── python 全量语法编译 ──"
            python -m compileall -q backend_ingestion/app alert_engine/app simulator tests

            # ② 测试文件健全性：STATUS.md §五曾手工扫过一次「假覆盖测试文件」，
            #    这里把它变成机器门禁 —— 任何 test_*.py 不含真实 def test_ 即红。
            echo "── 测试文件健全性（每个 test_*.py 至少一个真实 test 函数）──"
            missing=0
            for f in $(find tests alert_engine/tests backend_ingestion/tests -name 'test_*.py'); do
              if ! grep -qE '^[[:space:]]*def test_' "$f"; then
                echo "无真实测试函数: $f"
                missing=1
              fi
            done
            if [ "$missing" != "0" ]; then
              echo "发现假覆盖测试文件 —— 门禁拒绝"
              exit 1
            fi

            # ③ 后端 import 冒烟：LEDGER §8.3 第 5 条长期挂着的未验项。
            #    本机 Win-ARM64 装不了 pydantic-core 轮子（需 Rust 编译），故只能由 CI 承证；
            #    python:3.11 镜像有现成轮子。JWT_SECRET 只占位让 Settings() 实例化成功，
            #    不参与签名，真实密钥绝不入仓（AGENTS.md §5）。
            echo "── 后端 import 冒烟 ──"
            (cd backend_ingestion && JWT_SECRET=ci-import-smoke-placeholder python -c "import app.main; print('backend app.main import OK')")
            (cd alert_engine && JWT_SECRET=ci-import-smoke-placeholder python -c "import app.main; print('alert_engine app.main import OK')")

        - name: npm-test
          image: node:20
          script: |
            set -eu
            cd frontend_dashboard
            # npm 10 实测（2026-10-11 两个 CI 轮次）：lockfile 在 Windows 生成时只写
            # win32 的 rollup 原生可选依赖条目；无论 npm ci 还是 npm install，
            # 只要 lockfile 存在就不据 rollup 的 optionalDependencies 元数据补装
            # linux-x64 变体 → vitest 启动即崩（npm/cli#4828）。
            # 解法：测试门禁内删 lockfile 让 npm 在 linux 全新 resolve
            # （错误信息自身推荐的做法）；代价是传递依赖浮动，门禁可接受。
            rm -f package-lock.json
            npm install
            npm test
            # ISSUE #62 补的两道防线（此前 npm-test 只有 `npm test`，所以没人发现
            # tsc 已经红了 3 个错）：
            #   ① typecheck —— `npm run build` 是 `tsc --noEmit && vite build`，
            #      第一步失败 = 生产构建脚本实际是坏的，而 main 一直显示全绿。
            #   ② bundle 体积 + 裸 ECharts 引入守卫（scripts/report-bundle-size.mjs），
            #      阈值 gzip < 320 kB（issue #62 验收口径）。
            npm run typecheck
            npx vite build
            node scripts/report-bundle-size.mjs
    # ⏸️ sync-to-github 暂停（2026-10-11）：imports 引用的 flow.237/RobotMonitor-secrets
    # 仓不存在（API 404 实证）→ 本 pipeline 每次 prepare 即 error，把本已全绿的
    # push 构建整体拖成 error，掩盖真实回归。恢复条件：建 secrets 仓并注入
    # github-sync.yml（GIT_USERNAME / GIT_ACCESS_TOKEN）后，取消下面注释即可。
    #   - name: sync-to-github
    #     # 单向同步 CNB main -> github.com/TopRemnantAcademy/robot-monitor（Issue #64 / C4）
    #     # 凭据只从密钥仓库 imports 注入（GIT_USERNAME / GIT_ACCESS_TOKEN），禁止明文写入本文件。
    #     imports:
    #       - https://cnb.cool/flow.237/RobotMonitor-secrets/-/blob/main/github-sync.yml
    #     stages:
    #       - name: push main to github origin
    #         if: '[ "$CNB_PIPELINE_KEY" != "pipeline-0" ]'
    #         image: tencentcom/git-sync
    #         settings:
    #           target_url: https://github.com/TopRemnantAcademy/robot-monitor.git
    #           auth_type: https
    #           username: ${GIT_USERNAME}
    #           password: ${GIT_ACCESS_TOKEN}
    #           branch: main
    #           force: false
    #           push_tags: false
    #           git_user: RobotMonitor Sync
    #           git_email: robot-monitor@users.noreply.github.com
    # ============================================================
    # e2e：端到端 30,000 行落库验证（ISSUE #60）—— 锚点定义处（&e2e-env / &e2e-stages）
    #
    # 为什么单独一条 pipeline：它需要 **Docker-in-Docker**（services: [docker]）
    # 才能起 emqx + timescaledb:2.13.1 + redis + backend + mock_fleet。
    # 判定与产出：起栈前先探 docker、再探 python；缺任一则打印【E2E SKIP】原因并以 0 退出。
    # （2026-10-11 修复：本 pipeline 原先被写成了第二个顶层 push:/pull_request: 键，
    #  YAML 重复键导致整条 main 的 push/PR 流水线在 prepare 阶段就 error —— duration 0、无日志。
    #  现并入唯一 push:/pull_request: 键下；锚点定义在 push（文档序最先），pull_request/crontab 用别名引用。）
    # ============================================================
    - name: e2e-30k-landing
      # ---- 为什么必须钉 image（2026-10 CI 实测教训）----
      # 不写 image 时用缺省镜像 `cnbcool/default-build-env`，该镜像**没有 python3**：
      # 首次实跑报 `sh: line 21: python3: command not found`（返回码 127），
      # 而此时 docker 探测已经通过（日志里的 `docker 可用：Docker version 29.6.2`），
      # 即「环境判定全绿 → 脚本起不来」，属于最坏的一类失败（红得莫名其妙）。
      # 所以这里把运行环境写死成有 python3 的镜像，而不是靠默认镜像碰运气。
      # 同理，脚本里也**不再**用 `python3` 裸命令，见下方 runner 探测。
      docker:
        image: python:3.11-slim
      services: [docker]
      env: &e2e-env
        # 40s × 100 台 × 10Hz ≈ 40,000 帧，相对 30,000 阈值留足余量。
        E2E_DURATION: "40"
        E2E_ROBOTS: "100"
        E2E_MIN_ROWS: "30000"
      stages: &e2e-stages
        - name: e2e
          script: |
            set -uo pipefail
            echo "== e2e 30k 落库验证（ISSUE #60）=="

            # ---- 环境判定：无 Docker 即明确 skip，绝不 red ----
            if ! command -v docker >/dev/null 2>&1; then
              echo "【E2E SKIP】PATH 内找不到 docker 命令。"
              echo "本 job 需要真实 Docker（emqx + timescaledb:2.13.1 + redis + backend + mock_fleet），"
              echo "且 ISSUE #60 禁止用 mock 替身冒充真实 TimescaleDB。"
              echo "需要：在提供 docker 的构建机/自托管 runner 上运行本 job，或本地执行"
              echo "  python -m pytest tests/e2e/test_e2e_30k.py -v -s"
              exit 0
            fi
            if ! docker info >/dev/null 2>&1; then
              echo "【E2E SKIP】docker daemon 不可达（docker info 非 0）。原始输出（尾部）："
              docker info 2>&1 | tail -5 || true
              exit 0
            fi
            echo "docker 可用：$(docker --version)"

            # ---- 运行环境判定：连 python 都没有就明确 skip，绝不 red ----
            # 这一层是实跑打出来的：首次 CI 里 docker 可用，但缺省镜像无 python3，
            # 脚本根本没起来（返回码 127）。所以顺序必须是
            # 「先探 docker（本 job 的核心依赖）→ 再探 python（脚本自身的依赖）」，
            # 两层都给出原因与解法，读者不必翻配置就知道卡在哪一层。
            if command -v python3 >/dev/null 2>&1; then
              PY=python3
            elif command -v python >/dev/null 2>&1; then
              PY=python
            else
              echo "【E2E SKIP】镜像内 PATH 找不到 python3/python（当前镜像：${CNB_BUILD_IMAGE:-缺省镜像}）。"
              echo "本 job 需要 python 来驱动 tests/e2e/test_e2e_30k.py（只用标准库，无需 pip 安装）。"
              echo "修复：在本 pipeline 上声明 docker.image（如 python:3.11-slim），不要沿用缺省镜像。"
              exit 0
            fi
            echo "python 可用：$($PY --version 2>&1)"

            # ---- 订单 32 / ISSUE #100：指标命名反例探针 ----
            #
            # 为什么挂在**这里**（先把栈起好、再针对已起的栈断言）：命名门禁要断言的是
            # 「跑起来的那个进程吐出的字节」，而 `test_e2e_30k.py` 的 run_e2e() 中途
            # 会 teardown 掉栈；等它跑完再探就没人接了。故由本 stage 自己先 `up -d`
            # （**不带 stress profile**，不起 mock_fleet）拿到一个活的 backend，
            # 跑一次命名断言，然后 down 掉 —— 与 30k 落库两件事互不干扰。
            #
            # 判定：HTTP 探不到 → [SKIP] 并 exit 0（环境问题，不伪装通过）；
            #       旧名残留 / 新名缺失 → 脚本退出码 1 → **本 stage 变红**。
            # 这道门禁的价值全在「能红」：一个吞掉失败的门禁比没有门禁更糟。
            echo "== 订单 32：指标命名反例探针 =="
            if ! docker compose -f tests/e2e/docker-compose.e2e.yml up -d --build \
                 emqx timescaledb redis backend; then
              echo "【E2E SKIP】订单 32 命名探针：起栈失败（环境问题，非代码失败）"
              docker compose -f tests/e2e/docker-compose.e2e.yml down -v --remove-orphans || true
              exit 0
            fi
            i=0
            while [ $i -lt 36 ]; do
              if curl -sf http://127.0.0.1:18000/healthz >/dev/null 2>&1; then break; fi
              i=$((i + 1)); sleep 5
            done
            if ! curl -sf http://127.0.0.1:18000/metrics >/dev/null 2>&1; then
              echo "【E2E SKIP】订单 32 命名探针：/metrics 在 180s 内不可达（栈未就绪）"
              docker compose -f tests/e2e/docker-compose.e2e.yml down -v --remove-orphans || true
              exit 0
            fi
            $PY tests/e2e/test_e2e_30k.py --metric-naming-check
            naming_rc=$?
            docker compose -f tests/e2e/docker-compose.e2e.yml down -v --remove-orphans || true
            if [ "$naming_rc" = "3" ]; then
              echo "【E2E SKIP】订单 32 命名探针：脚本自判环境不具备（退出码 3），非代码失败。"
              exit 0
            fi
            if [ "$naming_rc" != "0" ]; then
              echo "【E2E FAIL】订单 32 命名门禁未通过（退出码 $naming_rc）—— 旧前缀指标残留或规范名缺失。"
              exit "$naming_rc"
            fi
            echo "订单 32 命名门禁通过：/metrics 旧名 0 命中，robot_backend_* 规范名全部在位。"

            # 依赖：e2e 脚本只用标准库（subprocess/urllib），无需 pip 安装。
            $PY tests/e2e/test_e2e_30k.py
            rc=$?
            if [ "$rc" = "3" ]; then
              echo "【E2E SKIP】脚本自判环境不具备（退出码 3），非代码失败。"
              exit 0
            fi
            exit "$rc"
  pull_request:
    - name: test
      docker:
        image: python:3.11
      stages:
        - name: pytest
          script: |
            set -eu
            # tests/load/test_payload_contract.py 需要 node 实跑 payload.js 取样例报文
            # （订单 23 契约：payload 复用 mock_fleet 真实 24 关节结构，漏跑=契约裸奔）。
            # python:3.11 镜像无 node；Debian bookworm 的 nodejs 18 支持 --input-type=module。
            # 2026-10-11 首次实跑（CI 修复后）实证：3 failed, 68 passed —— 失败全因缺 node。
            apt-get update -qq && apt-get install -y -qq --no-install-recommends nodejs >/dev/null
            node --version
            python -m pip install --no-cache-dir -r alert_engine/requirements.txt
            python -m pip install --no-cache-dir -r backend_ingestion/requirements.txt
            # fakeredis 是**测试期**依赖：订单 04 的验收用例要验去重器的 SET NX 幂等
            # 与 TTL，进程内 dict 替身测不出 Redis 服务端语义。
            python -m pip install --no-cache-dir pytest pytest-timeout 'httpx<0.28' fakeredis
            # rich 是 tests/test_ts_sampling.py 间接需要的**测试期**依赖：该文件要 exec
            # simulator/mock_fleet.py，而后者在 :41 `from rich.console import Console`。
            # 上面两个 requirements 都**不含** rich（simulator 的依赖不入 CI）。
            #
            # 测试侧已能把「缺依赖」判为 SKIP（见 tests/test_ts_sampling.py 的
            # Skip/_PytestSkipped），所以**不装也不会红**。这里仍然补装，是因为
            # 「跳过」和「跑过」不是一回事：这 3 个用例盯的是 PK (time, robot_id)
            # 的毫秒时间戳唯一性（ON CONFLICT DO NOTHING 会静默丢行），
            # 长年 SKIP 等于门禁不存在。补装后它们在 CI 真跑。
            # 版本与 simulator/requirements.txt 对齐，避免「本机能跑、CI 不能跑」。
            python -m pip install --no-cache-dir rich==13.7.1
            echo "── pytest（仓库根）──"
            python -m pytest -q
            echo "── pytest backend_ingestion/tests ──"
            # 2026-10-11 实测：backend 套件一例 F 后整体挂死 10.8m 被 runner SIGKILL，
            # F 的名字与栈都没打出来。加 pytest-timeout（单测 60s 封顶，超时打栈）
            # 与 -v（挂死时日志至少留有「最后一个开跑的用例」），一次跑出可定位现场。
            python -m pytest backend_ingestion/tests/ -v --timeout=60

            # 与 push 分支**逐字相同**的三道门禁 —— 两边口径必须一致，
            # 否则会出现「PR 绿了、合到 main 才变红」，直接污染回归信号：
            #   ① compileall 全量语法编译
            #   ② test_*.py 真实测试函数健全性
            #   ③ 后端 import 冒烟（LEDGER §8.3-5 历史上只能在本机跑不了的那一项）
            echo "── python 全量语法编译 ──"
            python -m compileall -q backend_ingestion/app alert_engine/app simulator tests
            echo "── 测试文件健全性 ──"
            missing=0
            for f in $(find tests alert_engine/tests backend_ingestion/tests -name 'test_*.py'); do
              if ! grep -qE '^[[:space:]]*def test_' "$f"; then
                echo "无真实测试函数: $f"
                missing=1
              fi
            done
            if [ "$missing" != "0" ]; then
              echo "发现假覆盖测试文件 —— 门禁拒绝"
              exit 1
            fi
            echo "── 后端 import 冒烟 ──"
            (cd backend_ingestion && JWT_SECRET=ci-import-smoke-placeholder python -c "import app.main; print('backend app.main import OK')")
            (cd alert_engine && JWT_SECRET=ci-import-smoke-placeholder python -c "import app.main; print('alert_engine app.main import OK')")
        - name: npm-test
          image: node:20
          script: |
            set -eu
            cd frontend_dashboard
            # npm 10 实测（2026-10-11 两个 CI 轮次）：lockfile 在 Windows 生成时只写
            # win32 的 rollup 原生可选依赖条目；无论 npm ci 还是 npm install，
            # 只要 lockfile 存在就不据 rollup 的 optionalDependencies 元数据补装
            # linux-x64 变体 → vitest 启动即崩（npm/cli#4828）。
            # 解法：测试门禁内删 lockfile 让 npm 在 linux 全新 resolve
            # （错误信息自身推荐的做法）；代价是传递依赖浮动，门禁可接受。
            rm -f package-lock.json
            npm install
            npm test
            # 同 push 分支：ISSUE #62 的 typecheck + bundle 守卫，口径必须两边一致，
            # 否则会出现「PR 绿了但合到 main 变红」的错位。
            npm run typecheck
            npx vite build
            node scripts/report-bundle-size.mjs
    # e2e 与 push 共用同一份 stages/env（锚点定义在 push 块，此处按文档序用别名引用）
    - name: e2e-30k-landing
      docker:
        image: python:3.11-slim
      services: [docker]
      env: *e2e-env
      stages: *e2e-stages


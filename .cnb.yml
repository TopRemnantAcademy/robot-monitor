# RobotMonitor CNB NPC configuration
# Two triggers:
#  A) Issue/PR comment @mention (NPC mode): write @flow.237/RobotMonitor(developer) in an Issue comment to dispatch work
#  B) crontab autonomous pipeline -- **deleted 2026-10-20** (removed all auto-triggered NPC settings per user instruction;
#     the original 7-stage agent inspection was long-unusable due to 402 quota; see the tombstone at the end of the file)
include:
  - https://cnb.cool/Bring/Agents/Agent/-/blob/main/npc.yml

$:
  issue:
    comment@npc:
      image: cnbcool/default-npc:latest
      settings:
        max_turns: 200
        workspace_preflight: on
  pull_request:
    comment@npc:
      image: cnbcool/default-npc:latest
      settings:
        max_turns: 200
        workspace_preflight: on

    # -----------------------------------------------------------------------
    # Order 18 T2 -- contract gate (contract-as-code)
    #
    # **Deliberately no `|| true` / `continue-on-error` fallback**: a gate that can be swallowed is as good as no gate.
    # Both checks must turn the build red:
    #   1) generated-types-must-be-committed -- api.gen.ts and openapi.snapshot.json out of sync
    #   2) contract-snapshot-check           -- backend removed a field/changed a type but did not sync the snapshot (breaking)
    # Basis: this repo already truly broke once (STATUS.md section six, item 2 -- `/history` missed `joint_positions`
    # causing the Drawer's third line chart to be permanently empty). That time it "passed manual comparison" but the machine exposed it on first run.
    #
    # Declared in object form (`contract-gate:` is the pipeline id), on the same level as NPC's `comment@npc:`;
    # basis: the syntax manual "also supports declaring multiple pipelines via object form".
    #
    # The image uses `ci/contract-gate.Dockerfile` instead of bare node:20 -- in practice node:20's python3
    # has neither pip nor ensurepip (see the top note in that Dockerfile), so deps must be installed at image build time.
    # All logic is folded into `ci/contract-gate.sh` (POSIX sh) to avoid dozens of hard-to-maintain inline script lines.
    # -----------------------------------------------------------------------
    contract-gate:
      docker:
        build:
          dockerfile: ci/contract-gate.Dockerfile
          by:
            - ci/contract-gate.Dockerfile
            - backend_ingestion/requirements.txt
            # `by` is the **whitelist** of files the Dockerfile may COPY; files not listed do not enter the build context
            # (the official grammar.md warns explicitly about this). These 3 files must strictly match the COPY directives in
            # ci/contract-gate.Dockerfile; missing one -> the build fails immediately with
            # `failed to calculate checksum ... not found`
            # (verified: when package.json was missing, build cnb-jgf-1k4k4c9db died at this step).
            - frontend_dashboard/package.json
            - frontend_dashboard/package-lock.json
      env:
        # Only so `Settings()` can be instantiated at import time (jwt_secret has no default).
        # It is a placeholder string, participates in no signing; real secrets never enter the repo (AGENTS.md §5).
        JWT_SECRET: ci-openapi-export-placeholder
      stages:
        - name: contract-gate
          script: sh ci/contract-gate.sh

main:
  # -- Order 24 T3: test gate -------------------------------------------------
  # Purpose: turn the hand-written "11/11" / "20/20" / "25 passed" in STATUS.md into CI-reproducible numbers.
  # Any failure turns red: any step exiting non-zero aborts the stages and sets the pipeline to error --
  # never use `|| true` / `continue-on-error` throughout (Order 24 §4.2).
  #
  # WARNING: about the stage shell (this file once went red for it): CNB runs script with `sh` (dash),
  #   dash does NOT support `set -o pipefail`; use `set -eu` instead.
  # WARNING: about `pytest` testpaths (pytest.ini, Order 24 §4.1 forbids changing it):
  #   bare `pytest` uses testpaths = tests + alert_engine/tests;
  #   `backend_ingestion/tests` is deliberately NOT in it, so it runs as a separate command.
  push:
    - name: test
      docker:
        image: python:3.12
      stages:
        - name: pytest
          script: |
            set -eu
            # tests/load/test_payload_contract.py needs node to actually run payload.js to sample example messages
            # (Order 23 contract: payload reuses mock_fleet's real 24-joint structure; skipping = contract runs naked).
            # python:3.11 image has no node; Debian bookworm's nodejs 18 supports --input-type=module.
            # First real run 2026-10-11 (after CI fix) evidence: 3 failed, 68 passed -- all failures were due to missing node.
            apt-get update -qq && apt-get install -y -qq --no-install-recommends nodejs >/dev/null
            node --version
            python -m pip install --no-cache-dir -r alert_engine/requirements.txt
            python -m pip install --no-cache-dir -r backend_ingestion/requirements.txt
            # fakeredis is a **test-time** dependency: Order 04's acceptance case must verify the deduper's SET NX idempotence
            # and TTL; an in-process dict stub cannot exercise Redis server-side semantics.
            python -m pip install --no-cache-dir pytest pytest-timeout 'httpx<0.28' fakeredis
            # rich is an indirect **test-time** dependency of tests/test_ts_sampling.py: that file execs
            # simulator/mock_fleet.py, which at :41 does `from rich.console import Console`.
            # Neither of the two requirements above contains rich (simulator deps are not in CI).
            #
            # The test side can already judge "missing dependency" as SKIP (see tests/test_ts_sampling.py's
            # Skip/_PytestSkipped), so NOT installing it would not turn red either. We still install it because
            # "skipped" and "run" are not the same: these 3 cases watch the millisecond-timestamp uniqueness of PK (time, robot_id)
            # (ON CONFLICT DO NOTHING silently drops rows),
            # a perpetual SKIP equals a non-existent gate. After installing, they truly run in CI.
            # Versions are aligned with simulator/requirements.txt to avoid "works locally, fails in CI".
            python -m pip install --no-cache-dir rich==13.7.1
            echo "── pytest (repo root, testpaths = tests + alert_engine/tests) ──"
            python -m pytest -q
            echo "── pytest backend_ingestion/tests (top-level app package conflict, run separately) ──"
            # Verified 2026-10-11: after one F in the backend suite the whole run hung for 10.8m and was SIGKILLed by the runner,
            # with neither the F's name nor stack printed. Add pytest-timeout (60s cap per test, prints stack on timeout)
            # and -v (at least logs "the last test that started" when it hangs) to surface a locatable scene in one run.
            python -m pytest backend_ingestion/tests/ -v --timeout=60

            # -- 2026-11-10 added: bridge job (ROS2 / ISO 21423, standalone package, no app conflict) --
            # bridge only hard-depends on websockets; aiomqtt is a lazy optional import, not installed here.
            echo "── pytest bridge/tests (ROS2 / ISO 21423 bridge, standalone package) ──"
            python -m pip install --no-cache-dir -r bridge/requirements.txt
            python -m pip install --no-cache-dir pytest pytest-timeout
            # 2026-11-10 next-step: build the Rust extension so the Rust backend path is
            # actually exercised (and guarded by test_backend_active.py) in CI. Rust install is
            # best-effort: if the toolchain is unavailable the suite still runs via Python fallback.
            if ! command -v cargo >/dev/null 2>&1; then
              echo "── installing Rust toolchain (rustup) for iso21423_rs ──"
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y || echo "rustup install failed; skipping Rust build"
            fi
            if command -v cargo >/dev/null 2>&1; then
              echo "── building iso21423_rs (maturin develop) ──"
              python -m pip install --no-cache-dir maturin
              (cd bridge/iso21423-rs && python -m maturin develop) || echo "maturin build failed; suite will use Python fallback"
            fi
            python -m pytest bridge/tests/ -v --timeout=60

            # -- 2026-10-13 added three more gates (previously only hand-verified on the main agent's local machine, now solidified) --
            # 1) Full syntax compile: catch syntax errors "never collected by tests, so never found by anyone".
            #    Local run verified rc=0 (backend_ingestion/app + alert_engine/app + simulator + tests).
            echo "── python full syntax compile ──"
            python -m compileall -q backend_ingestion/app alert_engine/app simulator tests bridge

            # 2) Test-file sanity: STATUS.md section five once hand-scanned for "fake-coverage test files",
            #    here it becomes a machine gate -- any test_*.py without a real def test_ turns red.
            echo "── test-file sanity (each test_*.py has at least one real test function) ──"
            missing=0
            for f in $(find tests alert_engine/tests backend_ingestion/tests bridge/tests -name 'test_*.py'); do
              if ! grep -qE '^[[:space:]]*def test_' "$f"; then
                echo "No real test function: $f"
                missing=1
              fi
            done
            if [ "$missing" != "0" ]; then
              echo "Found fake-coverage test file -- gate rejected"
              exit 1
            fi

            # 3) Backend import smoke: the long-pending unverified item from LEDGER §8.3 item 5.
            #    Local Win-ARM64 cannot install the pydantic-core wheel (needs Rust compilation), so only CI can prove it;
            #    the python:3.11 image has a ready wheel. JWT_SECRET is only a placeholder to let Settings() instantiate,
            #    not used for signing; real secrets never enter the repo (AGENTS.md §5).
            echo "── backend import smoke ──"
            (cd backend_ingestion && JWT_SECRET=ci-import-smoke-placeholder python -c "import app.main; print('backend app.main import OK')")
            (cd alert_engine && JWT_SECRET=ci-import-smoke-placeholder python -c "import app.main; print('alert_engine app.main import OK')")

        - name: npm-test
          image: node:20
          script: |
            set -eu
            cd frontend_dashboard
            # npm 10 verified (2026-10-11, two CI rounds): when the lockfile is generated on Windows it only writes
            # win32's rollup native optional-dependency entries; whether npm ci or npm install,
            # as long as the lockfile exists it does not reinstall the linux-x64 variant from rollup's optionalDependencies metadata
            # -> vitest crashes on startup (npm/cli#4828).
            # Fix: delete the lockfile inside the test gate so npm does a fresh linux resolve
            # (the approach the error message itself recommends); the cost is floating transitive deps, acceptable for the gate.
            rm -f package-lock.json
            npm install
            npm test
            # Two extra guardrails added for ISSUE #62 (before this, npm-test only had `npm test`, so nobody noticed
            # tsc had already gone red with 3 errors):
            #   1) typecheck -- `npm run build` is `tsc --noEmit && vite build`,
            #      a failed first step = the production build script is actually broken, yet main kept showing all green.
            #   2) bundle size + bare-ECharts import guard (scripts/report-bundle-size.mjs),
            #      threshold gzip < 320 kB (ISSUE #62 acceptance criterion).
            npm run typecheck
            npx vite build
            node scripts/report-bundle-size.mjs
    # ============================================================
    # sync-to-github removed (2026-11-09, per user instruction "don't do it on CNB, local-first"):
    # the original CNB CI one-way sync (tencentcom/git-sync) never actually worked because this repo is PUBLIC and this
    # account's CNB token lacks group-resource:rw (403 when creating the secret repo) -- GitHub main long lagged CNB main by 46+ commits.
    # Now changed to [local direct push]: `git push origin main` (GitHub remote = TopRemnantAcademy/robot-monitor,
    # PRIVATE), SHA already aligned (3072f7c). CNB is only a passive git remote, hosting no sync/automation.
    # ============================================================
    # e2e: end-to-end 30,000-row landing validation (ISSUE #60) -- anchor definition site (&e2e-image / &e2e-env / &e2e-stages)
    #
    # Why a separate pipeline: it needs **Docker-in-Docker** (services: [docker])
    # to bring up emqx + timescaledb:2.13.1 + redis + backend + mock_fleet.
    # Judgment and output: before starting the stack, probe docker first, then python; if either is missing print [E2E SKIP] with the reason and exit 0.
    # (Fixed 2026-10-11: this pipeline was originally written as a second top-level push:/pull_request: key,
    #  the duplicate YAML key made the whole main push/PR pipeline error at the prepare stage -- duration 0, no logs.
    #  Now merged under the single push:/pull_request: key; anchors are defined in push (first in document order), pull_request/crontab reference them by alias.)
    # ============================================================
    - name: e2e-30k-landing
      # ---- Why the image must be pinned (2026-10 CI verified lesson) ----
      # Without an image, the default `cnbcool/default-build-env` is used, which has NO python3:
      # the first real run reported `sh: line 21: python3: command not found` (exit code 127),
      # yet the docker probe had already passed (log line `docker available: Docker version 29.6.2`),
      # i.e. "environment checks all green -> script never starts", the worst kind of failure (red for no obvious reason).
      # So here the runtime is hard-coded to an image that has python3, rather than relying on default-image luck.
      # Likewise, the script no longer uses the bare `python3` command either; see the runner probe below.
      #
      # ---- Order 34 T1/T2: image changed to an **anchor** and referenced by all three e2e sites ----
      # Root-cause conclusion (file:line + log dual evidence, see PR description):
      #   this image declaration has ALWAYS been in effect; push build cnb-152-1k4ohjp3k-002 (sha 68b7b8b)
      #   has `docker pull python:3.11-slim` in its prepare log, and the e2e stage printed
      #   `python available: Python 3.11.17`. What truly ran on the default image was the **crontab build**
      #   cnb-st7-1k4onp4ok-001 (same sha) -- because the `"crontab: 0 3 * * *"` pipeline
      #   (originally `.cnb.yml:479`) **only wrote services/env/stages, missing docker.image**
      #   (not the "push block declaration failed" first guessed in Order 34). The crontab's prepare log was therefore
      #   `docker pull cnbcool/default-build-env`.
      # Fix: lift the image into an anchor, referenced by all three sites with the same value -- consistency guaranteed at the YAML layer,
      # not by a human remembering to change it in three places (Order 32's change added lines to push/PR but not crontab,
      # exactly the inevitable result of "three copies maintained by hand").
      docker: &e2e-image
        image: python:3.12-slim
      services: [docker]
      env: &e2e-env
        # 40s x 100 units x 10Hz ~ 40,000 frames, plenty of headroom over the 30,000 threshold.
        E2E_DURATION: "40"
        E2E_ROBOTS: "100"
        E2E_MIN_ROWS: "30000"
      stages: &e2e-stages
        - name: e2e
          script: |
            set -uo pipefail
            echo "== e2e 30k landing validation (ISSUE #60) =="

            # SKIP banner (Order 34 T2): any exit without a real run must print this line first,
            # and it MUST be a prominent, grep-able fixed string, so "green" can no longer fake a real run.
            # Background: the e2e of push build cnb-st7-1k4onp4ok was only 240ms, status=success,
            # with only one line [E2E SKIP] in the log -- a human scanning the CI list saw only "green", not that it didn't run.
            skip_banner() {
              echo "================================================================"
              echo "[E2E SKIPPED -- this build did not actually run the 30k landing]"
              echo "Reason: $1"
              echo "This build's e2e is green but produced NO landing numbers; it cannot count as evidence for ISSUE #60."
              echo "================================================================"
            }

            # ---- Environment check: no Docker -> explicit skip, never red ----
            if ! command -v docker >/dev/null 2>&1; then
              echo "[E2E SKIP] docker command not found in PATH."
              echo "This job needs real Docker (emqx + timescaledb:2.13.1 + redis + backend + mock_fleet),"
              echo "and ISSUE #60 forbids faking real TimescaleDB with a mock stand-in."
              echo "Need: run this job on a build machine/self-hosted runner that provides docker, or run locally:"
              echo "  python -m pytest tests/e2e/test_e2e_30k.py -v -s"
              skip_banner "docker command not found in PATH (runner did not provide Docker-in-Docker)"
              exit 0
            fi
            if ! docker info >/dev/null 2>&1; then
              echo "[E2E SKIP] docker daemon unreachable (docker info non-zero). Original output (tail):"
              docker info 2>&1 | tail -5 || true
              skip_banner "docker daemon unreachable"
              exit 0
            fi
            echo "docker available: $(docker --version)"

            # ---- Runtime check: no python at all -> explicit skip, never red ----
            # This layer was uncovered by a real run: in the first CI, docker was available but the default image had no python3,
            # so the script never even started (exit code 127). Therefore the order must be
            # "probe docker first (this job's core dependency) -> then probe python (the script's own dependency)",
            # both layers giving a reason and a fix, so the reader knows which layer is stuck without reading config.
            #
            # Order 34 addendum: the only reason this check ever triggers is that **this pipeline did not declare
            # `docker.image`**. The three e2e sites (push / pull_request / crontab) now uniformly inject the image via
            # the YAML anchor `&e2e-image`, so the config layer should have no gap;
            # if this still prints SKIP, it means the anchor is not referenced by these three sites (checkable by file:line).
            if command -v python3 >/dev/null 2>&1; then
              PY=python3
            elif command -v python >/dev/null 2>&1; then
              PY=python
            else
              echo "[E2E SKIP] python3/python not found in image PATH (current image: ${CNB_BUILD_IMAGE:-default image})."
              echo "This job needs python to drive tests/e2e/test_e2e_30k.py (standard library only, no pip install needed)."
              echo "Fix: this pipeline must reference the docker.image anchor (the &e2e-image in .cnb.yml = python:3.11-slim),"
              echo "      do not keep the default image cnbcool/default-build-env (it has no python3)."
              skip_banner "image has no python3/python (docker.image anchor not in effect)"
              exit 0
            fi
            echo "python available: $($PY --version 2>&1)"

            # ---- Order 32 / ISSUE #100: metric-naming antipattern probe ----
            #
            # Why it hangs **here** (bring up the stack first, then assert against the running stack): the naming gate asserts
            # "bytes emitted by the running process", but `test_e2e_30k.py`'s run_e2e() tears the stack down midway;
            # probing after it finishes would find nothing listening. So this stage first `up -d` on its own
            # (without the stress profile, no mock_fleet) to get a live backend,
            # runs one naming assertion, then brings it down -- independent from the 30k landing work.
            #
            # Judgment: HTTP unreachable -> [SKIP] and exit 0 (environment issue, not faking a pass);
            #       old-name residue / new-name missing -> script exit code 1 -> this stage turns RED.
            # The whole value of this gate is "can turn red": a gate that swallows failures is worse than no gate.
            #
            # WARNING: Order 34 fix: the original used `curl -sf` to probe /healthz and /metrics, but this job's
            #   runtime image is python:3.11-slim -- which ships NO curl (Debian slim has neither curl nor wget).
            #   So regardless of whether the stack was up, both probes were permanently "unreachable",
            #   and this gate NEVER actually ran once from the day it was hung (proven by three push/PR build logs:
            #   cnb-sfb-1k4oh9va6-002 / cnb-152-1k4ohjp3k-002 e2e stages both show
            #   `[E2E SKIP] Order 32 naming probe: /metrics unreachable within 180s`).
            #   Changed to call `$PY` (this job's own runtime) for HTTP probing, adding no new dependency.
            # ---- Order: naming probe first, then 30k; but the two results are collected INDEPENDENTLY and merged at the end ----
            # Why not let the naming probe "return on failure": it is Order 32's gate, while this job's main output
            # is the 30k landing number (Order 34 hard threshold). If the naming probe goes red and ends early,
            # 30k never gets its output, and the reader cannot tell "naming regression" from "landing regression".
            # So: store the naming probe's rc first, run 30k as normal, and only exit 0 when both are 0.
            naming_rc=0

            echo "== Order 32: metric-naming antipattern probe =="
            # WARNING: every command that may exit non-zero must swallow its exit code inline (`|| naming_rc=$?`):
            # verified (PR #111 first CI: cnb-dr0-1k4pbtmr7-002) this stage's shell would TERMINATE the whole script
            # after one non-zero command (`set -e` semantics), so "naming probe red" would also kill 30k -- the main
            # output would be lost and the two issues indistinguishable. This is not turned off by `set -uo pipefail`;
            # the only way is to deny it the trigger.
            naming_rc=0
            if docker compose -f tests/e2e/docker-compose.e2e.yml up -d --build \
                 emqx timescaledb redis backend; then
              i=0
              while [ $i -lt 36 ]; do
                if $PY -c "import urllib.request;urllib.request.urlopen('http://127.0.0.1:18000/healthz',timeout=3)" >/dev/null 2>&1; then break; fi
                i=$((i + 1)); sleep 5
              done
              if $PY -c "import urllib.request;urllib.request.urlopen('http://127.0.0.1:18000/metrics',timeout=3)" >/dev/null 2>&1; then
                $PY tests/e2e/test_e2e_30k.py --metric-naming-check || naming_rc=$?
                if [ "$naming_rc" = "3" ]; then
                  echo "[E2E SKIP] Order 32 naming probe: script self-judged environment not ready (exit code 3), not a code failure."
                  skip_banner "Order 32 naming probe self-judged environment not ready (exit code 3)"
                  naming_rc=0
                elif [ "$naming_rc" != "0" ]; then
                  echo "[E2E FAIL] Order 32 naming gate FAILED (exit code $naming_rc) -- old-prefix metrics residue or canonical name missing."
                else
                  echo "Order 32 naming gate passed: 0 hits on old /metrics names; all robot_backend_* canonical names present."
                fi
              else
                # Stack is up but /metrics unreachable: this is NOT a code failure, nor something to silently pass.
                # Mark it "not actually run" (print banner); 30k still runs and gives landing numbers.
                echo "[E2E SKIP] Order 32 naming probe: /metrics unreachable within 180s (stack not ready)"
                skip_banner "Order 32 naming probe: /metrics unreachable within 180s (gate not actually run this round)"
              fi
            else
              echo "[E2E FAIL] Order 32 naming probe: stack failed to start."
              echo "(Order 34 tightened the rule: stack-up failure is NO LONGER treated as a silently-skippable environment issue --"
              echo "  this compose stack was already proven startable by a push build, so failure means code/config regression.)"
              naming_rc=1
            fi
            docker compose -f tests/e2e/docker-compose.e2e.yml down -v --remove-orphans || true

            # Deps: the e2e script uses only the standard library (subprocess/urllib); no pip install needed.
            # Again use `|| rc=$?` to swallow the exit code inline: this is the job's main output, must never be cut off by shell semantics.
            echo "== 30k landing main path (this job's hard-threshold output) =="
            rc=0
            $PY tests/e2e/test_e2e_30k.py || rc=$?
            if [ "$rc" = "3" ]; then
              echo "[E2E SKIP] Script self-judged environment not ready (exit code 3), not a code failure."
              skip_banner "test_e2e_30k.py self-judged environment not ready (exit code 3, no Docker / daemon unreachable)"
              rc=0
            fi
            # Merge judgment: naming-probe red, or 30k red, both turn this stage red (neither is silently passable).
            if [ "$rc" = "0" ] && [ "$naming_rc" = "0" ]; then
              echo "e2e stage all passed: 30k landing assertion passed + naming gate in place."
              exit 0
            fi
            if [ "$naming_rc" != "0" ]; then
              echo "[E2E FAIL] Order 32 naming gate FAILED (exit code $naming_rc) -- old-prefix metrics residue or canonical name missing."
            fi
            if [ "$rc" != "0" ]; then
              echo "[E2E FAIL] 30k landing assertion FAILED (exit code $rc)."
            fi
            exit 1
  pull_request:
    - name: test
      docker:
        image: python:3.12
      stages:
        - name: pytest
          script: |
            set -eu
            # tests/load/test_payload_contract.py needs node to actually run payload.js to sample example messages
            # (Order 23 contract: payload reuses mock_fleet's real 24-joint structure; skipping = contract runs naked).
            # python:3.11 image has no node; Debian bookworm's nodejs 18 supports --input-type=module.
            # First real run 2026-10-11 (after CI fix) evidence: 3 failed, 68 passed -- all failures were due to missing node.
            apt-get update -qq && apt-get install -y -qq --no-install-recommends nodejs >/dev/null
            node --version
            python -m pip install --no-cache-dir -r alert_engine/requirements.txt
            python -m pip install --no-cache-dir -r backend_ingestion/requirements.txt
            # fakeredis is a **test-time** dependency: Order 04's acceptance case must verify the deduper's SET NX idempotence
            # and TTL; an in-process dict stub cannot exercise Redis server-side semantics.
            python -m pip install --no-cache-dir pytest pytest-timeout 'httpx<0.28' fakeredis
            # rich is an indirect **test-time** dependency of tests/test_ts_sampling.py: that file execs
            # simulator/mock_fleet.py, which at :41 does `from rich.console import Console`.
            # Neither of the two requirements above contains rich (simulator deps are not in CI).
            #
            # The test side can already judge "missing dependency" as SKIP (see tests/test_ts_sampling.py's
            # Skip/_PytestSkipped), so NOT installing it would not turn red either. We still install it because
            # "skipped" and "run" are not the same: these 3 cases watch the millisecond-timestamp uniqueness of PK (time, robot_id)
            # (ON CONFLICT DO NOTHING silently drops rows),
            # a perpetual SKIP equals a non-existent gate. After installing, they truly run in CI.
            # Versions are aligned with simulator/requirements.txt to avoid "works locally, fails in CI".
            python -m pip install --no-cache-dir rich==13.7.1
            echo "── pytest (repo root) ──"
            python -m pytest -q
            echo "── pytest backend_ingestion/tests ──"
            # Verified 2026-10-11: after one F in the backend suite the whole run hung for 10.8m and was SIGKILLed by the runner,
            # with neither the F's name nor stack printed. Add pytest-timeout (60s cap per test, prints stack on timeout)
            # and -v (at least logs "the last test that started" when it hangs) to surface a locatable scene in one run.
            python -m pytest backend_ingestion/tests/ -v --timeout=60

            # -- 2026-11-10 added: bridge job (ROS2 / ISO 21423, standalone package, no app conflict) --
            # Must match the push branch exactly. bridge only hard-depends on websockets; aiomqtt is a lazy optional import.
            echo "── pytest bridge/tests (ROS2 / ISO 21423 bridge, standalone package) ──"
            python -m pip install --no-cache-dir -r bridge/requirements.txt
            python -m pip install --no-cache-dir pytest pytest-timeout
            # 2026-11-10 next-step: build the Rust extension so the Rust backend path is
            # actually exercised (and guarded by test_backend_active.py) in CI. Rust install is
            # best-effort: if the toolchain is unavailable the suite still runs via Python fallback.
            if ! command -v cargo >/dev/null 2>&1; then
              echo "── installing Rust toolchain (rustup) for iso21423_rs ──"
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y || echo "rustup install failed; skipping Rust build"
            fi
            if command -v cargo >/dev/null 2>&1; then
              echo "── building iso21423_rs (maturin develop) ──"
              python -m pip install --no-cache-dir maturin
              (cd bridge/iso21423-rs && python -m maturin develop) || echo "maturin build failed; suite will use Python fallback"
            fi
            python -m pytest bridge/tests/ -v --timeout=60

            # Identical word-for-word to the push branch's three gates -- the two sides must stay consistent,
            # otherwise you get "PR green but turns red after merging to main", directly polluting the regression signal:
            #   1) compileall full syntax compile
            #   2) real test function sanity in test_*.py
            #   3) backend import smoke (LEDGER §8.3-5, historically the only item that could not run locally)
            echo "── python full syntax compile ──"
            python -m compileall -q backend_ingestion/app alert_engine/app simulator tests bridge
            echo "── test-file sanity ──"
            missing=0
            for f in $(find tests alert_engine/tests backend_ingestion/tests bridge/tests -name 'test_*.py'); do
              if ! grep -qE '^[[:space:]]*def test_' "$f"; then
                echo "No real test function: $f"
                missing=1
              fi
            done
            if [ "$missing" != "0" ]; then
              echo "Found fake-coverage test file -- gate rejected"
              exit 1
            fi
            echo "── backend import smoke ──"
            (cd backend_ingestion && JWT_SECRET=ci-import-smoke-placeholder python -c "import app.main; print('backend app.main import OK')")
            (cd alert_engine && JWT_SECRET=ci-import-smoke-placeholder python -c "import app.main; print('alert_engine app.main import OK')")
        - name: npm-test
          image: node:20
          script: |
            set -eu
            cd frontend_dashboard
            # npm 10 verified (2026-10-11, two CI rounds): when the lockfile is generated on Windows it only writes
            # win32's rollup native optional-dependency entries; whether npm ci or npm install,
            # as long as the lockfile exists it does not reinstall the linux-x64 variant from rollup's optionalDependencies metadata
            # -> vitest crashes on startup (npm/cli#4828).
            # Fix: delete the lockfile inside the test gate so npm does a fresh linux resolve
            # (the approach the error message itself recommends); the cost is floating transitive deps, acceptable for the gate.
            rm -f package-lock.json
            npm install
            npm test
            # Same as the push branch: ISSUE #62's typecheck + bundle guard must match on both sides,
            # otherwise you get the mismatch "PR is green but turns red after merging to main".
            npm run typecheck
            npx vite build
            node scripts/report-bundle-size.mjs

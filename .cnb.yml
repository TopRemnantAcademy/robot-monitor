# RobotMonitor CNB NPC 配置
# 两种触发：
#  A) Issue/PR 评论 @mention（NPC 模式）：在 Issue 评论里写 @flow.237/RobotMonitor(开发工程师) 派工
#  B) crontab 自主流水线（常规模式）：每天 0/6/12/18 点跑 7 段，读 spec/ci/*-call.md 执行
include:
  - https://cnb.cool/Bring/Agents/Agent/-/blob/main/npc.yml

$:
  issue:
    comment@npc:
      image: cnbcool/default-npc:latest
      settings:
        max_turns: 200
        workspace_preflight: on
  pull_request:
    comment@npc:
      image: cnbcool/default-npc:latest
      settings:
        max_turns: 200
        workspace_preflight: on

main:
  # ── 订单 24 T3：测试门禁 ─────────────────────────────────────────────
  # 目的：把 STATUS.md 里手写的「11/11」「20/20」「25 passed」变成 CI 可复现数字。
  # 失败即红：任何一步非 0 退出都会中断 stages 并置流水线为 error ——
  # 全程**禁止** `|| true` / `continue-on-error`（订单 24 §4.2）。
  #
  # 为什么拆成两个 stage（而非一个）：pytest 要 Python、npm test 要 Node，
  # 一个 docker 镜像塞两套运行时会让镜像臃肿且版本漂移；用 stage 级 `image`
  # 各自用官方镜像，装什么完全由本仓 requirements/package.json 决定。
  #
  # ⚠️ 关于 `pytest` 的 testpaths（pytest.ini，订单 24 §4.1 禁止修改）：
  #   `pytest`（裸跑）走 testpaths = tests + alert_engine/tests；
  #   `backend_ingestion/tests` 刻意**不在**其内（顶层包 `app` 与 alert_engine 冲突，
  #   见 pytest.ini 注释），故单独一条命令跑。两条命令都跑才算「全仓测试通过」。
  push:
    - name: test
      docker:
        image: python:3.11
      stages:
        - name: pytest
          script: |
            set -euo pipefail
            python -m pip install --no-cache-dir -r alert_engine/requirements.txt
            python -m pip install --no-cache-dir -r backend_ingestion/requirements.txt
            # httpx<0.28：starlette 0.36.3 的 TestClient 仍用 `Client(app=...)` 旧签名，
            # httpx 0.28 移除了该 kwarg，装上会 7 个用例集体 TypeError（本机实测）。
            python -m pip install --no-cache-dir pytest 'httpx<0.28'
            echo "── pytest（仓库根，testpaths = tests + alert_engine/tests）──"
            python -m pytest -q
            echo "── pytest backend_ingestion/tests（顶层 app 包冲突，单独跑）──"
            python -m pytest backend_ingestion/tests/ -q

        - name: npm-test
          image: node:20
          script: |
            set -euo pipefail
            cd frontend_dashboard
            # npm ci 走 package-lock.json，锁定 vitest/testing-library/msw 的精确版本。
            npm ci
            npm test
  pull_request:
    - name: test
      docker:
        image: python:3.11
      stages:
        - name: pytest
          script: |
            set -euo pipefail
            python -m pip install --no-cache-dir -r alert_engine/requirements.txt
            python -m pip install --no-cache-dir -r backend_ingestion/requirements.txt
            python -m pip install --no-cache-dir pytest 'httpx<0.28'
            echo "── pytest（仓库根）──"
            python -m pytest -q
            echo "── pytest backend_ingestion/tests ──"
            python -m pytest backend_ingestion/tests/ -q

        - name: npm-test
          image: node:20
          script: |
            set -euo pipefail
            cd frontend_dashboard
            # npm ci 走 package-lock.json，锁定 vitest/testing-library/msw 的精确版本。
            npm ci
            npm test

  "crontab: 0 0,6,12,18 * * *":
    - stages:
        - name: pm-call
          image: docker.cnb.cool/bring/agents/agent:latest
          settings:
            max_turns: 30
            workspace_preflight: on
            system_prompt: |
              你是本仓库 RobotMonitor 的产品经理。严格遵守 AGENTS.md 全局纪律。
              你的身份与职责见 .cnb/settings.yml 中「产品经理」角色定义。
            user_prompt: |
              定时巡检。先用 bash 读取 ./spec/ci/pm-call.md，严格按其程序、禁止事项、产出格式执行，不要自创流程。

        - name: architect-call
          image: docker.cnb.cool/bring/agents/agent:latest
          settings:
            max_turns: 40
            workspace_preflight: on
            system_prompt: |
              你是本仓库 RobotMonitor 的架构师。严格遵守 AGENTS.md 全局纪律。
              你的身份与职责见 .cnb/settings.yml 中「架构师」角色定义。
            user_prompt: |
              定时巡检。先用 bash 读取 ./spec/ci/architect-call.md，严格按其程序执行，不要自创流程。

        - name: dev-call
          image: docker.cnb.cool/bring/agents/agent:latest
          settings:
            max_turns: 120
            workspace_preflight: on
            system_prompt: |
              你是本仓库 RobotMonitor 的开发工程师。严格遵守 AGENTS.md 全局纪律（无幻觉/完整可运行/性能护栏/数据契约）。
              你的身份与职责见 .cnb/settings.yml 中「开发工程师」角色定义。
            user_prompt: |
              定时巡检。先用 bash 读取 ./spec/ci/dev-call.md，严格按其程序执行，不要自创流程。

        - name: review-call
          image: docker.cnb.cool/bring/agents/agent:latest
          settings:
            max_turns: 60
            workspace_preflight: on
            system_prompt: |
              你是本仓库 RobotMonitor 的代码审查工程师。严格遵守 AGENTS.md 全局纪律。
              你的身份与职责见 .cnb/settings.yml 中「代码审查」角色定义。
            user_prompt: |
              定时巡检。先用 bash 读取 ./spec/ci/review-call.md，严格按其程序执行，不要自创流程。

        - name: test-call
          image: docker.cnb.cool/bring/agents/agent:latest
          settings:
            max_turns: 60
            workspace_preflight: on
            system_prompt: |
              你是本仓库 RobotMonitor 的测试工程师。严格遵守 AGENTS.md 全局纪律。
              你的身份与职责见 .cnb/settings.yml 中「测试工程师」角色定义。
            user_prompt: |
              定时巡检。先用 bash 读取 ./spec/ci/test-call.md，严格按其程序执行，不要自创流程。

        - name: compliance-call
          image: docker.cnb.cool/bring/agents/agent:latest
          settings:
            max_turns: 30
            workspace_preflight: on
            system_prompt: |
              你是本仓库 RobotMonitor 的合规门禁。严格遵守 AGENTS.md 全局纪律。
              你的身份与职责见 .cnb/settings.yml 中「合规」角色定义。
            user_prompt: |
              定时巡检。先用 bash 读取 ./spec/ci/compliance-call.md，严格按其程序执行，不要自创流程。

        - name: integration-call
          image: docker.cnb.cool/bring/agents/agent:latest
          settings:
            max_turns: 60
            workspace_preflight: on
            system_prompt: |
              你是本仓库 RobotMonitor 的测试/集成工程师。严格遵守 AGENTS.md 全局纪律。
              负责端到端联调：docker-compose 起栈 + 后端 + 告警引擎 + 模拟器压测 30s + 校验写入与告警。
            user_prompt: |
              定时巡检。先用 bash 读取 ./spec/ci/integration-call.md，严格按其程序执行，不要自创流程。

# RobotMonitor CNB NPC 配置
# 两种触发：
#  A) Issue/PR 评论 @mention（NPC 模式）：在 Issue 评论里写 @flow.237/RobotMonitor(开发工程师) 派工
#  B) crontab 自主流水线（常规模式）：每天 0/6/12/18 点跑 7 段，读 spec/ci/*-call.md 执行
include:
  - https://cnb.cool/Bring/Agents/Agent/-/blob/main/npc.yml

$:
  issue:
    comment@npc:
      image: cnbcool/default-npc:latest
      settings:
        max_turns: 200
        workspace_preflight: on
  pull_request:
    comment@npc:
      image: cnbcool/default-npc:latest
      settings:
        max_turns: 200
        workspace_preflight: on

main:
  "crontab: 0 0,6,12,18 * * *":
    - stages:
        - name: pm-call
          image: docker.cnb.cool/bring/agents/agent:latest
          settings:
            max_turns: 30
            workspace_preflight: on
            system_prompt: |
              你是本仓库 RobotMonitor 的产品经理。严格遵守 AGENTS.md 全局纪律。
              你的身份与职责见 .cnb/settings.yml 中「产品经理」角色定义。
            user_prompt: |
              定时巡检。先用 bash 读取 ./spec/ci/pm-call.md，严格按其程序、禁止事项、产出格式执行，不要自创流程。

        - name: architect-call
          image: docker.cnb.cool/bring/agents/agent:latest
          settings:
            max_turns: 40
            workspace_preflight: on
            system_prompt: |
              你是本仓库 RobotMonitor 的架构师。严格遵守 AGENTS.md 全局纪律。
              你的身份与职责见 .cnb/settings.yml 中「架构师」角色定义。
            user_prompt: |
              定时巡检。先用 bash 读取 ./spec/ci/architect-call.md，严格按其程序执行，不要自创流程。

        - name: dev-call
          image: docker.cnb.cool/bring/agents/agent:latest
          settings:
            max_turns: 120
            workspace_preflight: on
            system_prompt: |
              你是本仓库 RobotMonitor 的开发工程师。严格遵守 AGENTS.md 全局纪律（无幻觉/完整可运行/性能护栏/数据契约）。
              你的身份与职责见 .cnb/settings.yml 中「开发工程师」角色定义。
            user_prompt: |
              定时巡检。先用 bash 读取 ./spec/ci/dev-call.md，严格按其程序执行，不要自创流程。

        - name: review-call
          image: docker.cnb.cool/bring/agents/agent:latest
          settings:
            max_turns: 60
            workspace_preflight: on
            system_prompt: |
              你是本仓库 RobotMonitor 的代码审查工程师。严格遵守 AGENTS.md 全局纪律。
              你的身份与职责见 .cnb/settings.yml 中「代码审查」角色定义。
            user_prompt: |
              定时巡检。先用 bash 读取 ./spec/ci/review-call.md，严格按其程序执行，不要自创流程。

        - name: test-call
          image: docker.cnb.cool/bring/agents/agent:latest
          settings:
            max_turns: 60
            workspace_preflight: on
            system_prompt: |
              你是本仓库 RobotMonitor 的测试工程师。严格遵守 AGENTS.md 全局纪律。
              你的身份与职责见 .cnb/settings.yml 中「测试工程师」角色定义。
            user_prompt: |
              定时巡检。先用 bash 读取 ./spec/ci/test-call.md，严格按其程序执行，不要自创流程。

        - name: compliance-call
          image: docker.cnb.cool/bring/agents/agent:latest
          settings:
            max_turns: 30
            workspace_preflight: on
            system_prompt: |
              你是本仓库 RobotMonitor 的合规门禁。严格遵守 AGENTS.md 全局纪律。
              你的身份与职责见 .cnb/settings.yml 中「合规」角色定义。
            user_prompt: |
              定时巡检。先用 bash 读取 ./spec/ci/compliance-call.md，严格按其程序执行，不要自创流程。

        - name: integration-call
          image: docker.cnb.cool/bring/agents/agent:latest
          settings:
            max_turns: 60
            workspace_preflight: on
            system_prompt: |
              你是本仓库 RobotMonitor 的测试/集成工程师。严格遵守 AGENTS.md 全局纪律。
              负责端到端联调：docker-compose 起栈 + 后端 + 告警引擎 + 模拟器压测 30s + 校验写入与告警。
            user_prompt: |
              定时巡检。先用 bash 读取 ./spec/ci/integration-call.md，严格按其程序执行，不要自创流程。

# End-to-end 30,000-row persistence verification stack (ISSUE #60)
#
# Relationship to infra/docker-compose.yml: this does **not modify** the infrastructure stack; it only
# assembles a minimal "real pipeline" topology here — EMQX + TimescaleDB + Redis + backend + simulator,
# all on one Docker network. Why a separate file instead of layering onto infra's two files:
#   1. e2e needs to be **repeatable with one command** and should not depend on the host's .env
#      (`JWT_SECRET:?` would make compose exit immediately); here we use an e2e-specific secret,
#      unrelated to production credentials.
#   2. The simulator has no container at all in the infra stack (currently runs bare on the host),
#      so the entry point of the "1000 msg/s real persistence" pipeline was missing a containerized link.
#
# Usage:
#   docker compose -f tests/e2e/docker-compose.e2e.yml up -d --build   # start infra + backend
#   docker compose -f tests/e2e/docker-compose.e2e.yml run --rm mock_fleet  # controlled stress test
#   docker compose -f tests/e2e/docker-compose.e2e.yml down -v
# Or just drive it with tests/e2e/test_e2e_30k.py (recommended, see its file header).
#
# Discipline: the secrets here are used only for the **local/CI one-shot stack**, not production
# credentials, and no secret is read from outside the repo (AGENTS.md §5 forbids committing real
# credentials to the repo, not setting a fixed value for the test stack).
name: robotmonitor-e2e

services:
  emqx:
    # Locked to the same 5.6 tier as infra/docker-compose.yml (selection rationale in that file's comments):
    # 5.6.x is published continuously only on the emqx/emqx channel, making it the traceable source for 5.6.
    image: emqx/emqx:5.6
    environment:
      EMQX_LOG__LEVEL: warning
    healthcheck:
      # Prerequisite for `emqx ping` to work: emqx-docker's Dockerfile symlinks /opt/emqx/bin/* to
      # /usr/local/bin/ (verified in infra/docker-compose.yml comments).
      test: ["CMD", "emqx", "ping"]
      interval: 5s
      timeout: 5s
      retries: 24
      # start_period must be generous: EMQX's first boot expands the Erlang runtime,
      # and connecting before that yields a false "0 rows written" failure (R-07 §1).
      start_period: 40s

  timescaledb:
    # A real TimescaleDB, **no mock substitute allowed** (ISSUE #60 prohibition).
    # 2.13.1-pg16 is identical to infra/docker-compose.yml and is the version verified by R-09.
    image: timescale/timescaledb:2.13.1-pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: robot_monitor
    volumes:
      # Reuse the repo's single Schema source of truth (AGENTS.md §4): e2e tests init.sql itself,
      # and writing a separate DDL would decouple "e2e passes" from "production table creation".
      - ../../infra/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d robot_monitor"]
      interval: 5s
      timeout: 5s
      retries: 24

  redis:
    image: redis:7.2-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      # Context must be the repo root: the Dockerfile needs to COPY backend_ingestion/.
      context: ../..
      dockerfile: backend_ingestion/Dockerfile
    image: robot-monitor-backend:e2e
    environment:
      # service name is the Docker DNS
      MQTT_BROKER: emqx
      MQTT_PORT: "1883"
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://postgres:postgres@timescaledb:5432/robot_monitor
      # The dual-trigger window keeps the spec/01 §4.2 default (500 rows OR 1s),
      # deliberately **not reduced**: e2e verifies lossless persistence under production config, not after tuning.
      BATCH_TRIGGER_COUNT: "500"
      BATCH_TRIGGER_SECONDS: "1.0"
      # The backend requires JWT_SECRET at startup (config.py has no default; empty triggers ValidationError).
      # This is an e2e-only placeholder value, unrelated to any real environment.
      JWT_SECRET: "e2e-only-secret-0123456789abcdef0123456789abcdef"
    ports:
      - "18000:8000"   # also leave a port on the host so the e2e script can probe /healthz from outside
    depends_on:
      emqx:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # The backend's /healthz is a "liveness probe" — when deps are unreachable it still returns 200 with status=degraded
      # (backend_ingestion/app/main.py:85-118). So we can't just check the status code here;
      # we must wait until db=up to consider the backend **actually able to persist**, otherwise e2e starts early while DB is unready.
      test: ["CMD-SHELL", "python -c \"import urllib.request,json;d=json.load(urllib.request.urlopen('http://localhost:8000/healthz'));raise SystemExit(0 if d['db']=='up' else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 36
      start_period: 20s

  mock_fleet:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile.mock_fleet
    image: robot-monitor-mock-fleet:e2e
    # Not started with `up` by default: the stress test is run explicitly by the e2e script via `run`
    # (or pulled up manually via profile), otherwise the container connects immediately on start and tangles
    # the timing of "bringing up the stack" and "running the stress test" into one mess.
    profiles: ["stress"]
    environment:
      # ⚠️ Here we do **not** use compose's `${VAR:-default}` interpolation to pass duration/robot count.
      # compose's variable interpolation happens on the **host** when parsing the YAML, while
      # `docker compose run -e FLEET_DURATION=x` injects only at container start, so it can't change the
      # already-expanded command — using interpolation means "script specifies 40s" is silently overridden by the
      # host default forever (and errors nothing, the hardest-to-debug kind of silent failure).
      # So instead the entrypoint reads env vars **inside the container** before exec, so `-e` actually takes effect.
      FLEET_DURATION: "40"
      FLEET_ROBOTS: "100"
      # Minimum sent count (default 0 = no threshold): computed and injected by the e2e script as
      # E2E_ROBOTS×10×E2E_DURATION×0.5. Why it's needed: when send volume and STACK_HARD_LIMIT share the
      # same set of env vars, `docker compose run --rm` does **not** clear the compose env values, it just
      # replaces them with the host's values — so "script gives 100 robots" is silently overridden by compose's 5,
      # yielding 1000~2000 rows but passing `--min-sent 0`, a textbook silent false-green.
      # Once the lower bound is added, the stress phase itself exits non-zero and won't hide the problem until assertions.
      FLEET_MIN_SENT: "0"
      MQTT_BROKER: emqx
      MQTT_PORT: "1883"
    entrypoint:
      - /bin/sh
      - -c
      - |
        exec python /app/simulator/mock_fleet.py \
          --robots "$${FLEET_ROBOTS}" \
          --broker "$${MQTT_BROKER}" \
          --port "$${MQTT_PORT}" \
          --duration "$${FLEET_DURATION}" \
          --no-ui \
          --fault-rate 0.02 \
          --min-sent "$${FLEET_MIN_SENT:-0}"
    # No TTY inside the container; rich's Live control sequences would scramble the logs, so --no-ui logs one line per second.
    depends_on:
      emqx:
        condition: service_healthy
      backend:
        condition: service_healthy

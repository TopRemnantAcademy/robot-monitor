name: Bug report
description: Report a reproducible defect
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! A good bug report is reproducible and specific.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: How can a maintainer reproduce it? List commands, data, and config.
      placeholder: |
        1. Start the stack with `docker compose -f infra/docker-compose.yml up -d`
        2. Run `...`
        3. See error `...`
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Docker version, Node version, browser, commit/branch.
      placeholder: |
        - OS: Ubuntu 24.04
        - Docker: 27.x
        - Node: 20.x
        - Commit: <sha>
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / screenshots
      description: Paste error output or attach screenshots (drag & drop).

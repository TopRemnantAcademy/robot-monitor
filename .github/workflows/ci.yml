# RobotMonitor CI (GitHub Actions)
#
# CNB `.cnb.yml`'s test gates ported 1:1 to GitHub Actions, so the two stay in sync:
#   - backend   : pytest(testpaths) + backend_ingestion/tests + compileall + test-file sanity + import smoke
#   - frontend  : npm test + typecheck + vite build + bundle-size guard
#   - contract-gate : OpenAPI snapshot drift/breaking + generated types must match committed api.gen.ts + WS envelope ajv + tsc
#   - e2e       : real TimescaleDB stack 30k landing (ISSUE #60 forbids mock stand-ins)
#
# Trigger: push to main, or open a PR against main.
# Iron rule (same as CNB): never silently swallow failures -- any red gate must turn the build red.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v5
        with:
          node-version: "20"   # test_payload_contract.py needs node to actually run payload.js
      # Gate: backend_ingestion and alert_engine pydantic / pydantic-settings must match exactly.
      # CI installs both requirements into one venv; divergence causes pip ResolutionImpossible
      # (PR #25 / #20 went red for this before). Fail fast before any install to avoid "explodes mid-install".
      - name: Guard - pydantic pin lockstep (backend_ingestion <-> alert_engine)
        run: |
          set -eu
          for pkg in pydantic pydantic-settings; do
            a=$(grep -E "^${pkg}==" backend_ingestion/requirements.txt | head -1 || true)
            b=$(grep -E "^${pkg}==" alert_engine/requirements.txt | head -1 || true)
            if [ "$a" != "$b" ]; then
              echo "::error::PIN MISMATCH: '$a' (backend_ingestion) vs '$b' (alert_engine) — CI installs both into one venv; divergence breaks pip resolve (PR #25/#20)"
              exit 1
            fi
            echo "lockstep OK: $a"
          done
      - name: Install Python deps
        run: |
          set -eu
          python -m pip install --upgrade pip
          python -m pip install -r alert_engine/requirements.txt
          python -m pip install -r backend_ingestion/requirements.txt
          # fakeredis / httpx / rich are test-time deps (see the same comment in .cnb.yml)
          python -m pip install pytest pytest-timeout "httpx<0.28" fakeredis "rich==13.7.1"
      # tests/e2e/ are Docker integration tests. CNB's unit jobs run on the python:3.11 image which
      # has no docker, so these files were always skipped. The GitHub runner does have docker and
      # actually runs them, but running these tests directly in the unit job -- via standalone execution
      # (a dedicated e2e job) or container-readiness waiting -- causes failures/timeouts. As with CNB,
      # exclude them from the unit job, and let the dedicated e2e job run test_e2e_30k.py via the script.
      - name: pytest (root testpaths; e2e Docker tests run in dedicated e2e job)
        run: python -m pytest -q --ignore=tests/e2e
      - name: pytest backend_ingestion/tests (top-level app package conflict, run separately)
        run: python -m pytest backend_ingestion/tests/ -v --timeout=60
      - name: Compile all (syntax gate)
        run: python -m compileall -q backend_ingestion/app alert_engine/app simulator tests
      - name: Test-file sanity (each test_*.py has at least one real test function)
        run: |
          set -eu
          missing=0
          for f in $(find tests alert_engine/tests backend_ingestion/tests -name 'test_*.py'); do
            if ! grep -qE '^[[:space:]]*def test_' "$f"; then
              echo "No real test function: $f"
              missing=1
            fi
          done
          if [ "$missing" != "0" ]; then
            echo "Found fake-coverage test file -- gate rejected"
            exit 1
          fi
      - name: Backend import smoke
        run: |
          set -eu
          (cd backend_ingestion && JWT_SECRET=ci-import-smoke-placeholder python -c "import app.main; print('backend app.main import OK')")
          (cd alert_engine && JWT_SECRET=ci-import-smoke-placeholder python -c "import app.main; print('alert_engine app.main import OK')")
      # `test_metric_naming_probe.py` does not depend on Docker (it only feeds fake
      # /metrics text to `assert_metric_naming`, no stack up). But the `pytest -q --ignore=tests/e2e` above
      # excludes it too, so it was not actually run in any CI path before. Here we run it explicitly, so Order 32's
      # naming-antipattern gate is also present in unit tests (the e2e path only checks it once, insufficient coverage).
      - name: pytest metric-naming guard (docker-free)
        run: python -m pytest tests/e2e/test_metric_naming_probe.py -v

  bridge:
    name: Bridge tests (ROS2 / ISO 21423)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bridge deps
        run: |
          set -eu
          python -m pip install --upgrade pip
          python -m pip install -r bridge/requirements.txt
          python -m pip install pytest pytest-timeout
      - name: Install Rust toolchain (builds iso21423_rs extension)
        uses: dtolnay/rust-toolchain@stable
      - name: Build Rust extension (iso21423_rs)
        run: |
          set -eu
          python -m pip install maturin
          cd bridge/iso21423-rs
          python -m maturin develop
      - name: pytest bridge/tests (standalone package, no app collision)
        # test_backend_active.py now FAILS if the shim fell back to Python,
        # so this lane actually exercises (and guards) the Rust port.
        run: python -m pytest bridge/tests/ -v --timeout=60
      - name: Compile all (syntax gate)
        run: python -m compileall -q bridge simulator
      - name: Test-file sanity (each test_*.py has a real test function)
        run: |
          set -eu
          missing=0
          for f in $(find bridge/tests -name 'test_*.py'); do
            if ! grep -qE '^[[:space:]]*def test_' "$f"; then
              echo "No real test function: $f"
              missing=1
            fi
          done
          if [ "$missing" != "0" ]; then
            echo "Found fake-coverage test file -- gate rejected"
            exit 1
          fi

  frontend:
    name: Frontend tests (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend_dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Install (fresh Linux resolve, avoids Windows-generated lockfile)
        run: |
          set -eu
          rm -f package-lock.json
          npm install
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npx vite build
      - name: Bundle-size guard (gzip < 320 kB)
        run: node scripts/report-bundle-size.mjs

  contract-gate:
    name: Contract gate (OpenAPI / types / WS envelope)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Guard - pydantic pin lockstep (backend_ingestion <-> alert_engine)
        run: |
          set -eu
          for pkg in pydantic pydantic-settings; do
            a=$(grep -E "^${pkg}==" backend_ingestion/requirements.txt | head -1 || true)
            b=$(grep -E "^${pkg}==" alert_engine/requirements.txt | head -1 || true)
            if [ "$a" != "$b" ]; then
              echo "::error::PIN MISMATCH: '$a' (backend_ingestion) vs '$b' (alert_engine)"
              exit 1
            fi
          done
      - name: Install backend deps (OpenAPI export needs import app.main)
        run: |
          set -eu
          python -m pip install --upgrade pip
          python -m pip install -r backend_ingestion/requirements.txt
          python -m pip install -r alert_engine/requirements.txt
      - name: Install frontend deps
        working-directory: frontend_dashboard
        run: |
          set -eu
          rm -f package-lock.json
          npm install
      - name: Run contract gate (reuses ci/contract-gate.sh)
        run: bash ci/contract-gate.sh

  docs-sync:
    name: Docs sync (tech-stack diagram)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The README tech-stack graph is GENERATED from the real manifests
      # (docker-compose.yml, requirements.txt, package.json) by
      # scripts/gen_techstack.py. This job regenerates it and fails the build
      # if the committed diagram has drifted, so the graph always stays in
      # sync with the project's actual dependencies.
      - name: Regenerate tech-stack diagram and verify in sync
        run: |
          set -eu
          python3 scripts/gen_techstack.py
          if ! git diff --quiet -- README.md README.ko.md README.zh.md docs/tech-stack.mmd; then
            echo "::error::Tech-stack diagram is stale. Run 'python3 scripts/gen_techstack.py' and commit the result."
            git --no-pager diff -- README.md README.ko.md README.zh.md docs/tech-stack.mmd
            exit 1
          fi
          echo "tech-stack diagram in sync with manifests"

  e2e:
    name: E2E 30k landing (real TimescaleDB stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run e2e (reuses ci/run-e2e.sh, equivalent to CNB e2e-30k-landing)
        run: bash ci/run-e2e.sh

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend_dashboard"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    # Major bumps (e.g. vite 5->8, vitest 2->5, typescript 5->7) need deliberate,
    # tested migrations so they don't break contributor builds. We handle those as
    # dedicated PRs (see ROADMAP.md), not auto-PRs.
    ignore:
      - update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directory: "/backend_ingestion"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    ignore:
      - update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directory: "/alert_engine"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    ignore:
      - update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directory: "/simulator"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    ignore:
      - update-types: ["version-update:semver-major"]

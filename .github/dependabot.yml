version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend_dashboard"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    # Major bumps (e.g. vite 5->8, vitest 2->5, typescript 5->7, msw 2->3,
    # echarts 5->6, react 18->19, @vitejs/plugin-react 4->6) need deliberate,
    # tested migrations so they don't break contributor builds. We handle those
    # as dedicated PRs (see ROADMAP.md), not auto-PRs.
    ignore:
      - update-types: ["version-update:semver-major"]
    groups:
      # Bump @testing-library suite together to avoid type mismatches from single-package drift.
      testing-library:
        patterns:
          - "@testing-library/*"

  - package-ecosystem: "pip"
    directory: "/backend_ingestion"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    ignore:
      - update-types: ["version-update:semver-major"]
      # Pinned: bcrypt 5.x removed __about__, passlib detection fails -> fastapi-users login 500;
      # setuptools>=81 removed pkg_resources, passlib import fails -> uvicorn won't start.
      # Upgrading either requires migrating fastapi-users to pwdlib first (see requirements.txt comment).
      - dependency-name: "bcrypt"
      - dependency-name: "setuptools"
      # 0.x major jumps must be deliberate (dependabot's semver-major classification is unstable for 0.x, so pin explicitly):
      # fastapi 0.110->0.162 and uvicorn 0.28->0.54 both contain breaking changes; fastapi-users 12->15
      # switches passlib->pwdlib and needs companion auth-layer migration. All three are dedicated PRs in ROADMAP.
      - dependency-name: "fastapi"
      - dependency-name: "fastapi-users"
      - dependency-name: "uvicorn"
      # sqlalchemy 2.0.28->2.1.x is a 2.0->2.1 feature release (removes some long-deprecated APIs).
      # This repo uses modern 2.0 style (Mapped/mapped_column/async), likely compatible, but not verified in this env,
      # so pin 2.0.28 first and upgrade after a dedicated PR passes CI (see ROADMAP dependency strategy).
      - dependency-name: "sqlalchemy"
    groups:
      # OpenTelemetry is a coordinated release: API/SDK (exporter/instrumentation) must share a version.
      # Upgrading separately always conflicts (ResolutionImpossible), so group them and bump all in one PR.
      opentelemetry:
        patterns:
          - "opentelemetry*"
      # pydantic / pydantic-settings must be upgraded together (and kept aligned with alert_engine).
      pydantic:
        patterns:
          - "pydantic*"

  - package-ecosystem: "pip"
    directory: "/alert_engine"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    ignore:
      - update-types: ["version-update:semver-major"]
    groups:
      pydantic:
        patterns:
          - "pydantic*"

  - package-ecosystem: "pip"
    directory: "/simulator"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    ignore:
      - update-types: ["version-update:semver-major"]

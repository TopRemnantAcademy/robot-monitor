version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend_dashboard"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    # Major bumps (e.g. vite 5->8, vitest 2->5, typescript 5->7, msw 2->3,
    # echarts 5->6, react 18->19, @vitejs/plugin-react 4->6) need deliberate,
    # tested migrations so they don't break contributor builds. We handle those
    # as dedicated PRs (see ROADMAP.md), not auto-PRs.
    ignore:
      - update-types: ["version-update:semver-major"]
    groups:
      # @testing-library 套件一起升，避免单包漂移导致的类型不匹配。
      testing-library:
        patterns:
          - "@testing-library/*"

  - package-ecosystem: "pip"
    directory: "/backend_ingestion"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    ignore:
      - update-types: ["version-update:semver-major"]
      # 钉死：bcrypt 5.x 删掉 __about__，passlib 探测失败 -> fastapi-users 登录 500；
      # setuptools>=81 移除 pkg_resources，passlib import 失败 -> uvicorn 起不来。
      # 二者升级必须先迁移 fastapi-users 到 pwdlib（见 requirements.txt 注释）。
      - dependency-name: "bcrypt"
      - dependency-name: "setuptools"
      # 0.x 大版本跳变须刻意升级（dependabot 的 semver-major 对 0.x 分类不稳，显式钉死）：
      # fastapi 0.110->0.162、uvicorn 0.28->0.54 都含破坏性变更；fastapi-users 12->15
      # 切换 passlib->pwdlib，需配套鉴权层迁移。三者均在 ROADMAP 里作为 dedicated PR。
      - dependency-name: "fastapi"
      - dependency-name: "fastapi-users"
      - dependency-name: "uvicorn"
    groups:
      # OpenTelemetry 是协调发布：API/SDK(exporter/instrumentation) 必须同版本。
      # 分开升必冲突（ResolutionImpossible），故归为一组，一次 PR 全升。
      opentelemetry:
        patterns:
          - "opentelemetry*"
      # pydantic / pydantic-settings 必须同步升（且需与 alert_engine 对齐）。
      pydantic:
        patterns:
          - "pydantic*"

  - package-ecosystem: "pip"
    directory: "/alert_engine"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    ignore:
      - update-types: ["version-update:semver-major"]
    groups:
      pydantic:
        patterns:
          - "pydantic*"

  - package-ecosystem: "pip"
    directory: "/simulator"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    ignore:
      - update-types: ["version-update:semver-major"]

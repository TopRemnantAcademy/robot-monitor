# App-layer overlay — actually runs the backend and alert-engine inside the container network.
#
# Why this file is the key to "wiring things up":
#   Prometheus scrape targets are written as `backend:8000` / `alert-engine:8001`,
#   which are Docker-network service DNS names. If the app runs on the host (current setup),
#   these names simply don't resolve, so both jobs stay up=0 forever,
#   and the BackendDown / AlertEngineDown rules in the rules file will false-alarm permanently.
#   So "installed the exporter" != "wired it up" — the app must also be in the same network.
#
# Usage (three-layer overlay):
#   docker compose \
#     -f infra/docker-compose.yml \
#     -f infra/docker-compose.app.yml \
#     -f infra/observability/docker-compose.observability.yml up -d
version: "3.8"

services:
  backend:
    build:
      context: ..
      dockerfile: backend_ingestion/Dockerfile
    image: robot-monitor-backend:local
    container_name: robot-monitor-backend
    ports:
      - "8000:8000"          # /healthz, /robots, /ws/robots
    environment:
      # Service name is DNS: mqtt/redis/tsdb come from the base compose
      MQTT_BROKER: emqx
      MQTT_PORT: "1883"
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://postgres:postgres@timescaledb:5432/robot_monitor
      BATCH_TRIGGER_COUNT: "500"
      BATCH_TRIGGER_SECONDS: "1.0"
      # Auth secret (order 15). **Passed through from host .env, not hardcoded here** —
      # Hardcoding bakes the secret into the compose file (forbidden by AGENTS.md §5).
      # The `:?` in `${JWT_SECRET:?…}` makes compose fail and exit if it's unset,
      # instead of starting a backend that signs tokens with an empty secret (i.e. no auth).
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET not set: configure it in host .env (openssl rand -hex 32)}"
      JWT_LIFETIME_SECONDS: "${JWT_LIFETIME_SECONDS:-28800}"
      # Local dev: allow a separately-started frontend (Vite :5173) cross-origin access to the backend
      # (CORS_ALLOW_ORIGINS corresponds to backend_ingestion/app/config.py. Empty default = no CORS
      # middleware mounted, same-origin deployment is fine).
      CORS_ALLOW_ORIGINS: "${CORS_ALLOW_ORIGINS:-}"
    depends_on:
      emqx:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  alert-engine:
    build:
      context: ..
      dockerfile: alert_engine/Dockerfile
    image: robot-monitor-alert-engine:local
    container_name: robot-monitor-alert-engine
    ports:
      - "8001:8001"          # /metrics
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://postgres:postgres@timescaledb:5432/robot_monitor
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

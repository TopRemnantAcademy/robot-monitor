# Platform self-health alert rules (PromQL).
#
# Boundary statement: the alerts here are for the **platform** (broker/backend/ingestion congestion),
# not the **robot itself**. The robot's own four alert types — motor_temp / battery_low / offline /
# joint_stuck — are judged by alert_engine at the application layer and do not go through Prometheus.
# The two are complementary: the robot_alert table answers "which robot broke",
# while here we answer "is the monitoring system itself still healthy" — if the latter fails,
# none of the former's conclusions can be trusted.
groups:
  - name: robot-monitor-platform
    rules:
      # Queue backlog keeps growing => ingestion can't keep up with 1000 msg/s, CPU or IO bottleneck
      - alert: IngestionQueueBacklog
        expr: robot_backend_queue_depth > 5000
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "Telemetry write queue backlog {{ $value }} items"
          description: "Exceeds 10x the batch threshold of 500; TimescaleDB writes likely blocked."

      # Non-zero MQTT drops indicate payload validation failure; the robot-side field contract is broken
      - alert: MqttMessagesDropped
        expr: increase(robot_backend_mqtt_dropped_total[1m]) > 0
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} MQTT messages dropped in the last 1 minute"
          description: "payload does not match the spec/01 telemetry schema; check the simulator/firmware version."

      # Synthetic WS probe (gap G-3 "fake-green dashboard"): `up=1` only proves /metrics is scraped,
      # not that the realtime stream still works. The probe truly connects to /ws/robots once from the
      # **client** side and waits for the first snapshot frame; failure = gateway stuck on upgrade /
      # snapshot threw / broadcast broke — in which cases the connection count may still be non-zero.
      - alert: WsStreamProbeFailing
        expr: robot_backend_ws_probe_alive == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "WS synthetic probe continuously failing (realtime stream broken from client's view)"
          description: "Probe target backend:8000/ws/robots. The dashboard may still show green, but no snapshot/telemetry/alert is being received."

      # Probe cumulative failures are growing (occasional flapping), complementary to the above "persistently 0".
      - alert: WsStreamProbeFlapping
        expr: increase(robot_backend_ws_probe_failures_total[5m]) > 2
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "WS synthetic probe failed {{ $value }} times in 5 minutes"
          description: "Realtime stream is unstable (network jitter/backend overload), not yet persistently unavailable; alerts before users notice."

      - alert: BackendDown
        expr: up{job="robot_backend"} == 0
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "Backend ingestion service down"

      - alert: AlertEngineDown
        expr: up{job="robot_alert_engine"} == 0
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "Alert engine down (all robot alerts are now stalled)"

      # Alert-of-alerts: detected but not written into robot_alert (G-4).
      # Why increase instead of > 0: Counters are monotonic, so `robot_alert_store_errors_total > 0`
      # once triggered would never reset for the process's whole lifetime, becoming a permanently
      # ringing dead alarm; increase(...[5m]) only looks at "failing again in the last 5 minutes",
      # auto-silencing after recovery.
      # for: 0s — a write failure is not jitter, no need to "confirm for N consecutive seconds".
      - alert: AlertStoreFailing
        expr: increase(robot_alert_store_errors_total[5m]) > 0
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} alerts failed to write to DB in 5 minutes"
          description: >-
            robot_alert write to DB is abnormal (connection / permission / disk).
            Note the frontend alert stream may still scroll normally at this point (PUBLISH and INSERT
            are decoupled); the dashboard turning green does not mean the alert was persisted —
            trust DB reconciliation.

      # ── Backup health (order 31 / G-5) ─────────────────────────────────────
      # Metric source: postgres-exporter custom query pgbackrest_backup_status
      #   ← view monitor.pgbackrest_backup_status ← official `pgbackrest --output=json info`.
      # Reuse existing channel: same platform group as AlertStoreFailing, same Alertmanager → webhook.
      #
      # Backup **stale**: more than 26h since the last successful backup (= 24h full cycle + 2h tolerance).
      # Why not an instantaneous criterion like `> 0`: backup is a **periodic** event, the correct
      # criterion is "freshness".
      - alert: BackupStale
        expr: |
          (time() - pgbackrest_backup_last_success_timestamp_seconds) > 93600
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "pgBackRest last successful backup was {{ $value | humanizeDuration }} ago"
          description: >-
            No new successful backup for over 26h (stanza={{ $labels.stanza }}).
            The backup job may be unscheduled, the repo unwritable, or backups persistently failing.
            The RPO commitment is already broken — immediately run infra/ops/pgbackrest/backup.sh full
            and check repo capacity.

      # Backup **incomplete**: the latest backup is marked error=true (backup set missing files /
      # checksum mismatch). Note the semantic boundary: this does not mean "no backup", but
      # "the newest one is not usable for recovery".
      - alert: BackupErrored
        expr: pgbackrest_backup_last_errored > 0
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "pgBackRest latest backup incomplete (stanza={{ $labels.stanza }})"
          description: >-
            Official info reports the latest backup error=true. This backup set is not usable for
            recovery; re-run backup.sh full and verify with backup.sh info / verify.sh.

      # stanza status not ok: repo path missing / lock anomaly / config error. At this point the
      # backup command itself will fail.
      - alert: BackupStanzaUnhealthy
        expr: pgbackrest_stanza_status_code > 0
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "pgBackRest stanza status abnormal (code={{ $value }}, stanza={{ $labels.stanza }})"
          description: >-
            Official info status.code != 0 (1=missing stanza path / 2=config error / others see docs).
            Backup will not succeed in this state; first follow DR-RUNBOOK §5.2 to run stanza-create
            and environment checks.

      - alert: TimescaleDown
        expr: up{job="postgres"} == 0
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "TimescaleDB unreachable"

      - alert: MqttBrokerDown
        expr: up{job="emqx"} == 0
        for: 20s
        labels:
          severity: critical
        annotations:
          summary: "EMQX broker unreachable (all 100 robots' data interrupted)"

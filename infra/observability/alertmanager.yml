# Alertmanager config — structure directly adapts external/alertmanager/doc/examples/simple.yml
# (official v0.28.1 example), changing the receiver from the example's email to this project's webhook.
#
# Relationship with alert_engine/app/main.py (important, don't confuse them):
#   - alert_engine judges **robots** (motor_temp/battery_low/offline/joint_stuck);
#     its inhibition semantics copy Alertmanager's inhibit_rules (see orders/10-dispatch.md).
#   - Alertmanager here judges the **platform** (Prometheus rules robot-alerts.yml).
#   Both share the same concepts (group_by / repeat_interval / inhibition) but act on different objects.
#
# Adaptation traces: route.group_by / group_wait / group_interval / repeat_interval
# and inhibit_rules field names align verbatim with the official example (simple.yml:19-36,:90-93).

global:
  resolve_timeout: 5m

route:
  # Group by alertname + severity: one platform incident pushes only one notification
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  # Platform incidents are less frequent than robot alerts, so a 1h repeat interval is enough
  repeat_interval: 1h
  receiver: robot-monitor-webhook

  routes:
    # critical goes to the same webhook immediately, but without waiting for group_wait
    - matchers:
        - severity="critical"
      receiver: robot-monitor-webhook
      group_wait: 0s
      repeat_interval: 30m
      continue: true

# Inhibition rules — the equivalent of the official example.
# Semantics: if backend is down, downstream symptoms like "queue backlog" have no actionable value; the root cause is upstream.
inhibit_rules:
  # source: backend unreachable (severity critical)
  # target: derived alerts like backlog/drop (severity warning)
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: ["alertname"]
  # Note (order 30): the robot-layer "higher severity inhibits same-robot lower severity" is NOT implemented
  #   in this file — it is done inside alert_engine (app/inhibition.py, equal equivalent to [robot_id], with
  #   credentials/logs/metrics traceability). Adding an equal=[robot_id] rule here would **duplicate** the
  #   engine-side inhibition, compressing the same alert twice across two layers and making metrics
  #   un-attributable. Hence deliberately omitted.

receivers:
  - name: robot-monitor-webhook
    webhook_configs:
      # The backend receives at /alerts/webhook; if that endpoint is not implemented, Alertmanager will
      #   retry and log, without affecting Prometheus / the scrape surface (unverified: that endpoint
      #   belongs to a later task; no new application code added this time).
      - url: "http://backend:8000/alerts/webhook"
        send_resolved: true

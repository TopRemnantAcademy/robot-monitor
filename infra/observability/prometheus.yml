# Prometheus scrape config — directly adapts external/prometheus's v3.x config syntax.
#
# Why this file didn't exist before:
#   `prometheus/client_python` was downloaded in a previous round, but **there is no import anywhere in
#   the code**, and no Prometheus server to scrape — i.e. "downloaded but not wired up".
#   Installing just the client library produces zero metrics; you need a server to scrape + an exporter to expose.
#
# Scrape target ports map one-to-one to the services in infra/docker-compose.yml:
#   backend  :8000 /metrics   <- exposed by backend_ingestion (see app/metrics.py)
#   alert    :8001 /metrics   <- exposed by alert_engine
#   postgres :9187            <- prometheus-community/postgres_exporter
#   redis    :9121            <- oliver006/redis_exporter
global:
  scrape_interval: 10s        # aligns with telemetry 10Hz / dashboard 10s refresh, no extra magnitude
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Application layer: backend collection and alert engine (custom business metrics)
  # The backend's **only canonical prefix is `robot_backend_*`** (ISSUE #72 unified dual-track naming;
  # the historical order 16 `robot_monitor_*` is deprecated/merged — see backend_ingestion/app/metrics.py header comment).
  - job_name: robot_backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: robot_alert_engine
    metrics_path: /metrics
    static_configs:
      - targets: ["alert-engine:8001"]

  # Broker layer: EMQX's built-in Prometheus endpoint (18083 port /api/v5/prometheus/stats)
  # Note: this endpoint requires an API key by default; unverified — if scraping fails, use emqtt-bench's
  #   --prometheus or the EMQX Dashboard metrics page instead; do not fake up=1.
  - job_name: emqx
    metrics_path: /api/v5/prometheus/stats
    static_configs:
      - targets: ["emqx:18083"]

  # Data layer: TimescaleDB / Redis (exposed via exporters, no DB changes needed)
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

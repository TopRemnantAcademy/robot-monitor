# Observability overlay layer — used in combination with infra/docker-compose.yml:
#
#   docker compose -f infra/docker-compose.yml \
#                  -f infra/observability/docker-compose.observability.yml up -d
#
# Why an overlay instead of editing the base compose:
#   The base compose is the minimal set to "get the dashboards running" (3 components) and must stay light;
#   observability is an ops enhancement layer, added on demand without increasing the dashboards' startup burden.
#
# Each service maps to a **downloaded** upstream repo (under external/), not an invented image name:
#   prometheus         <- external/prometheus              @ v3.2.1
#   alertmanager       <- external/alertmanager            @ v0.28.1
#   postgres-exporter  <- external/postgres_exporter       @ v0.17.1
#   redis-exporter     <- external/redis_exporter          @ v1.74.0
#
# ── Network (hard constraint of order 22 / I-12) ────────────────────────────
# The two exporters MUST be on the **same network** as timescaledb / redis, otherwise:
#   postgres_exporter cannot resolve the `timescaledb` hostname in DATA_SOURCE_NAME;
#   redis_exporter cannot resolve the `redis` hostname in REDIS_ADDR.
#   —— Both exporters will start, but /metrics will show zero business metrics — silent failure.
#
# Here we deliberately do **not** declare a top-level `networks:` block: when none of the three compose
#   files declares one, every service (including base's emqx/timescaledb/redis) lands on the
#   Compose-auto-created default network `{project}_default`, natively same-network. Once you add a
#   network in this file, you'd either have to bring base's services onto it (which means editing the
#   base compose, forbidden by this task), or the exporter ends up isolated → resolution failure.
#
# The project name must be consistent (a single `docker compose -f a -f b` command is consistent by
#   nature); if you split into two `up` commands, you must pass `-p robot-monitor` explicitly,
#   otherwise two networks get created and DNS is mutually invisible.
version: "3.8"

services:
  prometheus:
    # Official image name carries the org prefix (same lesson as EMQX: a bare name resolves to a same-named third-party image)
    image: prom/prometheus:v3.2.1
    container_name: robot-monitor-prometheus
    ports:
      - "9090:9090"     # UI + /api/v1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./rules:/etc/prometheus/rules:ro
      - prom-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: robot-monitor-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # Official example simple.yml:12 reads templates from templates/, following that directory convention
      - ./templates:/etc/alertmanager/template:ro

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: robot-monitor-postgres-exporter
    ports:
      - "9187:9187"
    # Order 31 §T3: expose pgBackRest backup status as metrics
    # (pgbackrest_backup_last_success_timestamp_seconds / _last_errored /
    #   pgbackrest_stanza_status_code), consumed by rules like BackupStale in robot-alerts.yml.
    # The custom query file and --extend.query-path usage are verified against:
    #   external/postgres_exporter/README.md "Adding new metrics via a config file (DEPRECATED)" section.
    # The upstream has marked this flag DEPRECATED (still usable): see the migration note at the top
    #   of the query file for details.
    command:
      - "--extend.query-path=/etc/postgres-exporter/queries.yaml"
    volumes:
      # Read-only mount: query definitions are code, not baked into the image (edit queries without rebuilding the exporter image).
      - ../ops/pgbackrest/postgres-exporter-queries.yaml:/etc/postgres-exporter/queries.yaml:ro
    environment:
      # Variable name verified from external/postgres_exporter/README.md:252 (DATA_SOURCE_NAME)
      #
      # The password MUST come from the host .env; plaintext in this file is not allowed (AGENTS.md §5).
      # Compose's `${VAR:?msg}` fails and exits when the var is unset — better than a default password:
      # a default password would let the exporter silently start on 9187 with wrong credentials, and
      # nobody would notice it isn't actually connected.
      # Local first use: cp .env.example .env (the template already includes POSTGRES_PASSWORD).
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD not set: configure it in host .env (see .env.example)}@timescaledb:5432/${POSTGRES_DB:-robot_monitor}?sslmode=disable"
    depends_on:
      - timescaledb

  redis-exporter:
    image: oliver006/redis_exporter:v1.74.0
    container_name: robot-monitor-redis-exporter
    ports:
      - "9121:9121"
    environment:
      # Variable name verified from external/redis_exporter/README.md:170 (REDIS_ADDR)
      REDIS_ADDR: "redis://redis:6379"
    depends_on:
      - redis

volumes:
  prom-data:

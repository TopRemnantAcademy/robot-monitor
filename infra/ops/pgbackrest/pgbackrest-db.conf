# pgBackRest — **数据库侧**配置（跑在 timescaledb 容器内）
#
# 为什么必须分成两份配置：
#   pgBackRest 是双端架构，PostgreSQL 主机与仓库主机**各自**都需要 pgbackrest
#   二进制与配置，且两边版本必须完全一致 —— 实证
#     external/pgbackrest/doc/xml/user-guide.xml:2770
#       "The pgBackRest version installed on the repository host must exactly match
#        the version installed on the PostgreSQL host."
#   DB 侧只描述「本地集群在哪 + 仓库主机是谁」；仓库侧描述「备份存哪、连哪个 PG」。
#
# 关键区别（实证 user-guide.xml:2762）：
#   "On PostgreSQL hosts, pg1-path is required to be the path of the local PostgreSQL
#    cluster and **no pg1-host should be configured**."
#   → 本文件**不含** pg1-host；它是 DB 本机视角。
#   但**必须**含 repo1-host（指向仓库边车）—— user-guide.xml:2881-2888 明示
#   「The database host must be configured with the repository host/user」。
#
# 凭证：DB 侧**不持有**仓库加密口令（加密在仓库侧完成）；
#       仓库主机认证走 TLS 客户端证书（见下方 repo1-host-type）。
#       本文件因此**不含任何明文密钥**。

[global]
log-level-console=info
log-level-file=detail

# 异步归档（reference.xml:1651）：复用连接、并行推送，8.64M 行/天 场景必需
archive-async=y
# 归档超时：默认 60s（reference.xml:1722 段）。持续高写入时单段推送偶发超 60s
# 会让 backup 因「无法确认 WAL 已归档」而失败，故放宽到 180s。
archive-timeout=180
# 归档队列上限（reference.xml:1699 段）：仓库瞬时不可用时本地堆积不丢数据
archive-push-queue-max=4GiB
process-max=2

# 仓库主机（= docker-compose.dr.yml 里的 service 名 `pgbackrest`）
repo1-host=pgbackrest
# 存储协议：TLS（容器网内容器间用证书互认，免去 SSH 密钥分发）
# 取值 tls/ssh 实证 user-guide.xml:2845「pgBackRest can use TLS ... It is also
# possible to use SSH」；TLS 相关键名实证 user-guide.xml:2890-2893
repo1-host-type=tls
# 证书路径（由 compose 挂载；证书生成见 docs/DR-RUNBOOK.md §5「生产加固」）
repo1-host-ca-file=/etc/pgbackrest/cert/ca.crt
repo1-host-cert-file=/etc/pgbackrest/cert/client.crt
repo1-host-key-file=/etc/pgbackrest/cert/client.key
# 客户端 CN 需与仓库侧 tls-server-auth 白名单匹配（user-guide.xml:2869）
# 仓库侧对应项：tls-server-auth=pgbackrest-client=demo（此处 stanza 名为 robot_monitor）

# 作为 TLS 服务端接受仓库侧回连时的监听（user-guide.xml:2870-2873）
tls-server-auth=pgbackrest-client=robot_monitor
tls-server-address=*
tls-server-ca-file=/etc/pgbackrest/cert/ca.crt
tls-server-cert-file=/etc/pgbackrest/cert/server.crt
tls-server-key-file=/etc/pgbackrest/cert/server.key

[robot_monitor]
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-user=postgres

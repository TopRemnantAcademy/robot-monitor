# pgBackRest — **database** side config (runs inside the timescaledb container)
#
# Why two separate config files are required:
#   pgBackRest is a dual-host architecture; the PostgreSQL host and the repository host **each** need pgbackrest
#   binary and config, and the two sides' versions must be exactly identical — verified:
#     external/pgbackrest/doc/xml/user-guide.xml:2770
#       "The pgBackRest version installed on the repository host must exactly match
#        the version installed on the PostgreSQL host."
#   The DB side only describes "where the local cluster is + who the repository host is"; the repository side
#   describes "where backups are stored, which PG to connect to".
#
# Key difference (verified user-guide.xml:2762):
#   "On PostgreSQL hosts, pg1-path is required to be the path of the local PostgreSQL
#    cluster and **no pg1-host should be configured**."
#   → this file does **not** contain pg1-host; it is the DB-local view.
#   but it **must** contain repo1-host (pointing to the repository sidecar) — user-guide.xml:2881-2888 states
#   "The database host must be configured with the repository host/user".
#
# Credentials: the DB side does **not hold** the repository encryption passphrase (encryption happens on the
#   repository side); repository host auth uses TLS client certificates (see repo1-host-type below).
#   This file therefore contains **no plaintext secret**.

[global]
log-level-console=info
log-level-file=detail

# Asynchronous archiving (reference.xml:1651): reuse connections, parallel push, required for the 8.64M rows/day scenario
archive-async=y
# Archive timeout: default 60s (reference.xml:1722 section). During sustained high write volume a single segment push occasionally exceeds 60s,
#   which would make backup fail with "cannot confirm WAL archived"; so relax it to 180s.
archive-timeout=180
# Archive queue upper bound (reference.xml:1699 section): accumulate locally without losing data when the repo is briefly unavailable
archive-push-queue-max=4GiB
process-max=2

# Repository host (= the service name `pgbackrest` in docker-compose.dr.yml)
repo1-host=pgbackrest
# Storage protocol: TLS (containers on the container network mutually trust certs, avoiding SSH key distribution)
# Values tls/ssh verified user-guide.xml:2845 "pgBackRest can use TLS ... It is also possible to use SSH";
# TLS-related key names verified user-guide.xml:2890-2893
repo1-host-type=tls
# Certificate paths (mounted by compose; cert generation see docs/DR-RUNBOOK.md §5 "production hardening")
repo1-host-ca-file=/etc/pgbackrest/cert/ca.crt
repo1-host-cert-file=/etc/pgbackrest/cert/client.crt
repo1-host-key-file=/etc/pgbackrest/cert/client.key
# Client CN must match the repository-side tls-server-auth allowlist (user-guide.xml:2869)
# Repository-side counterpart: tls-server-auth=pgbackrest-client=demo (stanza name here is robot_monitor)

# Listen as a TLS server when accepting the repository-side callback (user-guide.xml:2870-2873)
tls-server-auth=pgbackrest-client=robot_monitor
tls-server-address=*
tls-server-ca-file=/etc/pgbackrest/cert/ca.crt
tls-server-cert-file=/etc/pgbackrest/cert/server.crt
tls-server-key-file=/etc/pgbackrest/cert/server.key

[robot_monitor]
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-user=postgres

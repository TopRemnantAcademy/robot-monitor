# pgBackRest 备份配置（TimescaleDB = PostgreSQL 16）— **仓库(repository)侧**
#
# 配置路径语义实证（不是抄博客）：
#   external/pgbackrest/doc/xml/reference.xml:7
#   "The default location for the configuration file is /etc/pgbackrest/pgbackrest.conf.
#    If no file exists in that location then the old default of /etc/pgbackrest.conf will be checked."
# 选项名与取值实证（逐项对照 external/pgbackrest 官方 reference）：
#   repo1-path            reference.xml:23    Path，示例 /var/lib/pgbackrest
#   repo1-retention-full  reference.xml:535   Integer，count 语义（默认）：需第 3 份才过期第 1 份
#   repo1-cipher-type     reference.xml:1437  仅 aes-256-cbc 一个取值（reference.xml:1443）
#   repo1-cipher-pass     reference.xml:15    String，官方示例即为该键名
#   pg1-host / pg1-path   user-guide.xml:2762 仓库侧「必须」配 pg1-host 才能连 DB 主机
#   start-fast            reference.xml:20    Boolean，仅 y/n
#   process-max           reference.xml:372   Integer，并行进程数
#   archive-async         reference.xml:1651  Boolean，异步归档
#   archive-push-queue-max reference.xml:1699 Size，示例 1TiB；超限后 WAL 被丢弃并只发警告
#
# 版本：pgBackRest v2.59.3（README.md:7 "is the current stable release"，本仓已核对）
#
# ⚠️ 密钥注入：repo1-cipher-pass 的值从环境变量 PGBACKREST_CIPHER_PASS 读入。
#    环境变量映射规则实证：reference.xml:2127
#      "Any option may be set in an environment variable using the PGBACKREST_ prefix
#       and the option name in all caps replacing - with _"
#    → 仓库内**不出现任何明文密钥**（AGENTS.md §5）。
#
# ⚠️ 本文件仍需容器内 pgbackrest 二进制 + 真实演练环境才能端到端验证；
#    当前工作环境**无 Docker**，故 DR-RUNBOOK.md §6 单列「未验证」章节。

[global]
repo1-path=/var/lib/pgbackrest
# 全量保留 2 份（count 语义：需出现第 3 份才过期第 1 份，reference.xml:535）
repo1-retention-full=2
repo1-retention-diff=6
# 仓库加密：备份数据在**客户端侧**加密后才写入仓库（reference.xml:1437 段）
repo1-cipher-type=aes-256-cbc
# 值由环境变量注入，禁止在仓库中出现明文
repo1-cipher-pass=${PGBACKREST_CIPHER_PASS}

# 并行度：备份期间不能把 IO 吃干净，否则后端 500 行/批的落库会写不进去
process-max=2

log-level-console=info
log-level-file=detail
# 立即启动备份而非等待检查点；对 8.64M 行/天 的持续写入场景可显著缩短备份窗口
start-fast=y

# ── TLS（仓库↔DB 双端认证）──
# 存储协议用 TLS，免去容器间 SSH 密钥分发。键名实证 user-guide.xml:2870-2873
tls-server-auth=pgbackrest-client=robot_monitor
tls-server-address=*
tls-server-ca-file=/etc/pgbackrest/cert/ca.crt
tls-server-cert-file=/etc/pgbackrest/cert/server.crt
tls-server-key-file=/etc/pgbackrest/cert/server.key

[global:archive-push]
# WAL 归档队列上限（reference.xml:1699 段语义）：
#   超限时 pgBackRest 会「通知 PG 该 WAL 已成功归档，然后丢弃它」并只发一条警告 ——
#   即归档流被打断、PITR 无法越过该点，必须重新做全量。
#   8.64M 行/天 场景下，仓库不可用时宁可本地堆积，故给足 4GiB 缓冲。
archive-async=y
archive-push-queue-max=4GiB

# [robot_monitor] 是 stanza 名（= compose 里的库名）
[robot_monitor]
# pg1-path 必须**逐字等于** PG 的 data_directory（user-guide.xml configure-stanza 段原文：
# "Make sure that pg1-path is exactly equal to the value of data_directory"）。
# 本仓 timescaledb 卷挂载见 infra/docker-compose.yml：tsdb-data:/var/lib/postgresql/data
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-user=postgres
# 仓库侧必须配 pg1-host 才能连 DB 主机（user-guide.xml:2762）；
# 值为 compose service 名 `timescaledb`（容器 DNS）
pg1-host=timescaledb
# 双端 TLS：仓库作为客户端连 DB 侧的 TLS 服务端（user-guide.xml:2864-2867）
pg1-host-type=tls
pg1-host-ca-file=/etc/pgbackrest/cert/ca.crt
pg1-host-cert-file=/etc/pgbackrest/cert/client.crt
pg1-host-key-file=/etc/pgbackrest/cert/client.key

# pgBackRest 备份配置（TimescaleDB = PostgreSQL 16）
#
# 来源：external/pgbackrest/README.md（v2.59.3，2026-10-04 发布）
#   特性清单与配置项语义以 official docs 为准：
#   external/pgbackrest/doc/xml/reference.xml:7 → 默认配置路径 /etc/pgbackrest/pgbackrest.conf
#   （若该文件不存在则回退 /etc/pgbackrest.conf）
#
# ⚠️ 本文件是「待接入」配置，尚未在本仓库端到端验证过。
#   原因（事实）：timescale/timescaledb:2.13.1-pg16 镜像内**不含** pgbackrest 二进制，
#   要真跑起来必须换镜像或另起一个 pgbackrest 容器并用 SSH/TLS 协议连 PG。
#   两者都会改 infra/docker-compose.yml 的既有服务定义，属于订单级改动，
#   按 AGENTS.md「性能护栏/不臆断」的纪律，本次只交付配置与接入步骤，不假装已在跑。
#
# 已下载的源码只用于「拿配置契约」，不作为运行时依赖（external/ 已 gitignore）。
#
# 关键取舍：机器人遥测是 100 台 × 10Hz ≈ **每天 8.64M 行**，
# 这是一个「丢了就没了、但单条价值低」的数据集。默认的 full backup 策略在这里不成立，
# 必须靠 WAL 归档把 RPO 压到分钟级（见 stanza 段的 archive-async / archive-push-queue-max）。
[global]
repo1-path=/var/lib/pgbackrest
repo1-retention-full=2
repo1-retention-diff=6
repo1-cipher-type=aes-256-cbc
# 密钥从环境变量注入（仓库内禁止硬编码凭据，见 AGENTS.md §5）
repo1-cipher-pass=${PGBACKREST_CIPHER_PASS}

# 并行度：备份期间不能把 IO 吃干净，否则批量落库（500 行/批）会写不进去
process-max=2

log-level-console=info
log-level-file=detail
start-fast=y

[global:archive-push]
# WAL 归档队列上限：归档目标不可用时先本地堆积，超限才丢。
# 8.64M 行/天 的场景下，宁可堆积也不能让 PG 因为归档失败而卡住 WAL。
archive-async=y
archive-push-queue-max=4GiB

[robot_monitor]
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-user=postgres

# pgBackRest backup config (TimescaleDB = PostgreSQL 16) — **repository** side
#
# Config path semantics verified (not copied from a blog):
#   external/pgbackrest/doc/xml/reference.xml:7
#   "The default location for the configuration file is /etc/pgbackrest/pgbackrest.conf.
#    If no file exists in that location then the old default of /etc/pgbackrest.conf will be checked."
# Option names and values verified (item-by-item against the official external/pgbackrest reference):
#   repo1-path            reference.xml:23    Path, example /var/lib/pgbackrest
#   repo1-retention-full  reference.xml:535   Integer, count semantics (default): the 3rd copy must appear before the 1st expires
#   repo1-cipher-type     reference.xml:1437  only aes-256-cbc is a valid value (reference.xml:1443)
#   repo1-cipher-pass     reference.xml:15    String, the official example uses exactly this key name
#   pg1-host / pg1-path   user-guide.xml:2762  repository side 'must' configure pg1-host to reach the DB host
#   start-fast            reference.xml:20    Boolean, only y/n
#   process-max           reference.xml:372   Integer, number of parallel processes
#   archive-async         reference.xml:1651  Boolean, async archiving
#   archive-push-queue-max reference.xml:1699 Size, example 1TiB; beyond it WAL is dropped with only a warning
#
# Version: pgBackRest v2.59.3 (README.md:7 "is the current stable release", verified in this repo)
#
# ⚠️ Secret injection: the value of repo1-cipher-pass is read from the env var PGBACKREST_CIPHER_PASS.
#    Env var mapping rule verified: reference.xml:2127
#      "Any option may be set in an environment variable using the PGBACKREST_ prefix
#       and the option name in all caps replacing - with _"
#    → no plaintext secret ever appears in the repo (AGENTS.md §5).
#
# ⚠️ This file still needs the in-container pgbackrest binary + a real drill environment for end-to-end
#    verification; the current work environment has **no Docker**, so DR-RUNBOOK.md §6 lists a separate
#    'unverified' section.

[global]
repo1-path=/var/lib/pgbackrest
# Keep 2 full backups (count semantics: the 3rd copy must appear before the 1st expires, reference.xml:535)
repo1-retention-full=2
repo1-retention-diff=6
# Repo encryption: backup data is encrypted on the **client side** before being written to the repo (reference.xml:1437 section)
repo1-cipher-type=aes-256-cbc
# Value injected via env var; plaintext must not appear in the repo
repo1-cipher-pass=${PGBACKREST_CIPHER_PASS}

# Parallelism: must not consume all IO during backup, otherwise the backend's 500-rows/batch ingestion will fail to write
process-max=2

log-level-console=info
log-level-file=detail
# Start backup immediately instead of waiting for a checkpoint; for the 8.64M rows/day continuous-write scenario this significantly shortens the backup window
start-fast=y

# ── TLS (repository <-> DB mutual auth) ──
# Storage protocol uses TLS, avoiding SSH key distribution between containers. Key names verified user-guide.xml:2870-2873
tls-server-auth=pgbackrest-client=robot_monitor
tls-server-address=*
tls-server-ca-file=/etc/pgbackrest/cert/ca.crt
tls-server-cert-file=/etc/pgbackrest/cert/server.crt
tls-server-key-file=/etc/pgbackrest/cert/server.key

[global:archive-push]
# WAL archive queue upper bound (reference.xml:1699 section semantics):
#   when exceeded, pgBackRest will 'tell PG the WAL was archived successfully, then drop it' and only emit
#   a warning — i.e. the archive stream is broken, PITR cannot cross that point, and a full backup must be
#   redone. Under the 8.64M rows/day scenario, when the repo is unavailable it is better to accumulate
#   locally, so give a 4GiB buffer.
archive-async=y
archive-push-queue-max=4GiB

# [robot_monitor] is the stanza name (= the DB name in compose)
[robot_monitor]
# pg1-path must be **exactly equal** to PG's data_directory (user-guide.xml configure-stanza section verbatim:
# "Make sure that pg1-path is exactly equal to the value of data_directory").
# This repo's timescaledb volume mount: see infra/docker-compose.yml: tsdb-data:/var/lib/postgresql/data
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-user=postgres
# The repository side must configure pg1-host to reach the DB host (user-guide.xml:2762);
# the value is the compose service name `timescaledb` (container DNS)
pg1-host=timescaledb
# Mutual TLS: the repository connects to the DB-side TLS server as a client (user-guide.xml:2864-2867)
pg1-host-type=tls
pg1-host-ca-file=/etc/pgbackrest/cert/ca.crt
pg1-host-cert-file=/etc/pgbackrest/cert/client.crt
pg1-host-key-file=/etc/pgbackrest/cert/client.key

# DR overlay (disaster recovery) — used in combination with the base compose:
#
#   docker compose \
#     -f infra/docker-compose.yml \
#     -f infra/ops/pgbackrest/docker-compose.dr.yml up -d
#
# Goal: give timescaledb physical backup of "periodic full + continuous WAL archiving", quantifying RPO/RTO.
# Full rationale and recovery steps see docs/DR-RUNBOOK.md.
#
# ── Why "replace the timescaledb image + add a repo sidecar" rather than just adding a backup container ──
# pgBackRest's architecture is **dual-host**: the PostgreSQL host and the repository host **each** need
# pgbackrest binary and config, and versions must be exactly identical — verified:
#   external/pgbackrest/doc/xml/user-guide.xml:2770
#     "The pgBackRest version installed on the repository host must exactly match
#      the version installed on the PostgreSQL host."
# PG's WAL archiving is triggered via `archive_command = 'pgbackrest ... archive-push %p'`, and this command
#   executes **locally on the PG host** — so the timescaledb container must have the pgbackrest binary.
# Fact: the base compose's `timescale/timescaledb:2.13.1-pg16` image does **not** include it (recorded
#   in `infra/ops/pgbackrest/README.md` earlier). Hence this overlay supplies it via a derived image.
#
# ── Credentials ──
# repo1-cipher-pass is passed through from the host .env's PGBACKREST_CIPHER_PASS (AGENTS.md §5: no hardcoding).
# Use the `${VAR:?msg}` form: when unset, compose fails and exits, instead of starting a plaintext/empty-key repo.
#
# ⚠️ This overlay is currently **not run end-to-end in this repo** (the work environment has no Docker);
#    DR-RUNBOOK.md has a complete "unverified" section with the required conditions.

version: "3.8"

services:
  # ── ① Replace timescaledb with the pgbackrest-enabled derived image (source: Dockerfile.timescaledb in this dir) ──
  timescaledb:
    image: robot-monitor-timescaledb:p16-pgbackrest
    build:
      context: .
      dockerfile: Dockerfile.timescaledb
    # Note: this does not override the base compose's volumes/healthcheck — the overlay semantics is "merge",
    #   only new items are declared. The tsdb-data volume and init.sql mount still come from infra/docker-compose.yml.
    volumes:
      # DB-side pgbackrest config (read-only mount; secrets are not in this file)
      - ./ops/pgbackrest/pgbackrest-db.conf:/etc/pgbackrest/pgbackrest.conf:ro
      # WAL archive target: the repo volume shared with the repo sidecar (pgbackrest needs write access to repo-path)
      - pgbackrest-repo:/var/lib/pgbackrest
      # PG main config snippet: enables archive_mode/archive_command (see postgresql-dr.conf)
      - ./ops/pgbackrest/postgresql-dr.conf:/etc/postgresql/conf.d/zz-dr.conf:ro
      # pgbackrest log directory (DB-side archive logs)
      - pgbackrest-log:/var/log/pgbackrest
      # Mutual TLS certificates (DB side acts as TLS server, accepting the repo sidecar connection)
      - pgbackrest-certs:/etc/pgbackrest/cert:ro
      # Backup-status monitoring DDL (order 31 §T3): apply once on the DB side via psql -f /opt/dr/monitor.sql,
      #   creating the monitor.pgbackrest_info() function and the monitor.pgbackrest_backup_status view,
      #   consumed by postgres-exporter's custom query. Read-only mount, not baked into the image.
      - ./ops/pgbackrest/monitor.sql:/opt/dr/monitor.sql:ro
    # The timescaledb official image's postgres shares the same source as the PG official image and supports conf.d append snippets;
    # command appends -c config_file so it reads the main config.
    command:
      - "postgres"
      - "-c"
      - "config_file=/var/lib/postgresql/data/postgresql.conf"
      - "-c"
      - "include_dir=/etc/postgresql/conf.d"
    environment:
      # DB side does not need the repository encryption passphrase (encryption happens on the repository side), but needs to know the repo host address.
      # These two vars correspond to pg1-host / pg1-host-user, given on the db-side pgbackrest.conf via
      #   the command line (see the backup scripts); kept here as a placeholder note, not hardcoded.
      PGBACKREST_STANZA: robot_monitor

  # ── ② pgBackRest repository host: where the backup data lands ──
  pgbackrest:
    build:
      context: .
      dockerfile: Dockerfile
    image: robot-monitor-pgbackrest:local
    container_name: robot-monitor-pgbackrest
    volumes:
      # Repo volume: actual storage location for backups + WAL archive (production should point to a dedicated disk or object storage; see RUNBOOK)
      - pgbackrest-repo:/var/lib/pgbackrest
      # Repository-side config (includes the encryption-passphrase injection point, value from .env)
      - ./ops/pgbackrest/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - pgbackrest-log:/var/log/pgbackrest
      # Ops scripts mounted read-only into /opt/dr (not baked into the image, easy to revise on site).
      # Order 31's T2 three entrypoints backup/restore/verify (+ verify-restore for L3 restore comparison).
      - ./ops/pgbackrest/backup.sh:/opt/dr/backup.sh:ro
      - ./ops/pgbackrest/restore.sh:/opt/dr/restore.sh:ro
      - ./ops/pgbackrest/verify.sh:/opt/dr/verify.sh:ro
      - ./ops/pgbackrest/verify-restore.sh:/opt/dr/verify-restore.sh:ro
      # Order 25's old entrypoint retained (run-backup.sh is the predecessor of backup.sh, to avoid breaking existing runbooks)
      - ./ops/pgbackrest/run-backup.sh:/opt/dr/run-backup.sh:ro
      # Mutual TLS certificates (repository side acts as TLS server + client cert to connect to DB)
      - pgbackrest-certs:/etc/pgbackrest/cert:ro
    environment:
      # Repository encryption passphrase: `${VAR:?msg}` fails and exits when unset, preventing an empty-key repo
      PGBACKREST_CIPHER_PASS: "${PGBACKREST_CIPHER_PASS:?PGBACKREST_CIPHER_PASS not set: configure it in host .env (openssl rand -base64 48)}"
      # Override the pg1-path/host semantics written in the config: the repository side connects to the DB host (user-guide.xml:2762)
      PGBACKREST_PG1_HOST: timescaledb
      PGBACKREST_PG1_PATH: /var/lib/postgresql/data
    depends_on:
      timescaledb:
        condition: service_healthy
    # Idle waiting for commands by default; specific actions triggered by scripts/scheduler via `docker compose exec` or `run`
    command: ["-c", "sleep infinity"]
    restart: unless-stopped

volumes:
  # Repo volume — actual carrier of backups and WAL
  pgbackrest-repo:
  pgbackrest-log:
  # TLS certificate volume: placed after being generated by the openssl steps in runbook §5 "production hardening"
  pgbackrest-certs:

# postgres-exporter custom query: turn pgBackRest backup status into Prometheus metrics (order 31 §T3)
#
# Data source: the monitor.pgbackrest_backup_status view (see monitor.sql in this dir),
# whose underlying source is the official `pgbackrest --output=json info` stable interface.
#
# Why postgres-exporter rather than a new exporter:
#   Order 31 §T3 requires 'reuse the existing alert channel, don't build a separate one'. #59's
#   robot_alert_store_errors_total already flows through postgres_exporter → Prometheus rule →
#   Alertmanager → webhook. Backup status also lives in Postgres, so naturally reuses the same exporter.
#
# Mount method (see PG_EXPORTER_EXTEND_QUERY_PATH and --extend.query-path in
#   infra/observability/docker-compose.observability.yml).
#
# ⚠️ Upstream status: `--extend.query-path` is marked DEPRECATED in postgres_exporter
#    (README "Adding new metrics via a config file (DEPRECATED)" section), and the official recommendation
#    is to switch to a built-in collector function or sql_exporter. We keep it here because:
#      (a) v0.17.1 still supports it, not removed (the README option table still lists --extend.query-path);
#      (b) introducing sql_exporter would add a new service, contradicting 'reuse the existing channel'.
#    If the flag is removed in the future, the only migration point is here (the view
#    monitor.pgbackrest_backup_status stays unchanged).
#
# Metric semantics:
#   pgbackrest_backup_last_success_timestamp_seconds
#       stop moment (epoch seconds) of the last successful backup. Rules use time() - it to judge "stale".
#   pgbackrest_backup_last_errored
#       error flag of the last backup (0=intact, 1=incomplete). >0 triggers an alert.
#   pgbackrest_stanza_status_code
#       official info's stanza status.code (0=ok, non-zero=repo/stanza anomaly).
pgbackrest_backup_status:
  query: |
    SELECT
      stanza,
      last_backup_stop_epoch  AS last_success_timestamp_seconds,
      CASE WHEN last_backup_errored THEN 1 ELSE 0 END AS last_errored,
      status_code
    FROM monitor.pgbackrest_backup_status
  master: true
  metrics:
    - stanza:
        usage: "LABEL"
        description: "pgBackRest stanza name"
    - last_success_timestamp_seconds:
        usage: "GAUGE"
        description: "stop moment (epoch seconds) of the last successful backup"
    - last_errored:
        usage: "GAUGE"
        description: "whether the last backup carries an error flag (1=incomplete)"
    - status_code:
        usage: "GAUGE"
        description: "official info's stanza status.code (0=ok)"

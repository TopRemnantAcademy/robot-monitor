# PostgreSQL DR-related config snippet (loaded by the timescaledb container via include_dir)
#
# Pulled in by docker-compose.dr.yml's timescaledb.command via
#   -c include_dir=/etc/postgresql/conf.d
# include_dir is an officially supported PostgreSQL directive, verified:
#   postgres/postgres source src/backend/utils/misc/postgresql.conf.sample:926
#     #include_dir = '...'   # include files ending in '.conf' from a directory
#
# ⚠️ Why archive_mode is required: pgBackRest's "continuous WAL stream" relies on PG actively handing WAL
#   segments to archive_command. Without archive_mode, only "full/incremental snapshots" are possible,
#   and RPO degrades to the gap between two backups (hours-level) — not the minute-level we want.

# Archive mode: on = archive WAL segments that have been filled
# Value semantics see PostgreSQL official docs: wal_level / archive_mode / archive_command
archive_mode = on

# Hand each WAL segment to pgbackrest to push to the repo.
# The pgbackrest binary is installed into /usr/local/bin by Dockerfile.timescaledb.
# %p is replaced by PG with the full path of the WAL segment to archive (official archive_command contract).
# --stanza matches the stanza name configured on the repository side (robot_monitor).
archive_command = 'pgbackrest --stanza=robot_monitor --archive-async=y archive-push %p'

# WAL level: replica enables archiving + streaming replication; this single-node project also needs archiving, so at least replica.
# The timescaledb official image already defaults to replica; declared explicitly here for auditability.
wal_level = replica

# Force a segment switch every 30 seconds: under the 8.64M rows/day continuous write, WAL flows continuously anyway,
#   but during the night low-traffic period, if there is no write at all, the archive stream goes "static", making RPO unmeasurable by time.
# archive_timeout guarantees that worst-case a segment is still cut and archived every 30s (official PG parameter).
archive_timeout = 30s

# ── DR endpoint: only the pgbackrest sidecar is allowed to connect for physical backup ──
# Note: pgbackrest connects to this instance via pg1-host=timescaledb, reusing the postgres superuser.
# No extra pg_hba rule is opened here (the base compose already allows the docker network segment).
# Production should switch to a dedicated backup user + least privilege; see DR-RUNBOOK.md "production hardening".

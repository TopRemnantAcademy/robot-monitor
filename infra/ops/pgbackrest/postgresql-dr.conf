# PostgreSQL 灾备相关配置片段（由 timescaledb 容器通过 include_dir 载入）
#
# 被 docker-compose.dr.yml 的 timescaledb.command 通过
#   -c include_dir=/etc/postgresql/conf.d
# 引入。include_dir 是 PostgreSQL 官方支持的指令，实证：
#   postgres/postgres 源码 src/backend/utils/misc/postgresql.conf.sample:926
#     #include_dir = '...'   # include files ending in '.conf' from a directory
#
# ⚠️ 为什么必须有 archive_mode：pgBackRest 的「连续 WAL 流」依赖 PG 主动把 WAL
#    段交给 archive_command。不开 archive_mode，就只能做「全量/增量快照」，
#    RPO 会退化到两次备份之间的间隔（小时级）—— 那不是我们要的分钟级。

# 归档模式：on = 归档已写满的 WAL 段
# 取值语义见 PostgreSQL 官方文档 wal_level / archive_mode / archive_command
archive_mode = on

# 把每个 WAL 段交给 pgbackrest 推送到仓库。
# pgbackrest 二进制由 Dockerfile.timescaledb 装入 /usr/local/bin。
# %p 由 PG 替换为待归档 WAL 段的完整路径（官方 archive_command 契约）。
# --stanza 与仓库侧配置的 stanza 名一致（robot_monitor）。
archive_command = 'pgbackrest --stanza=robot_monitor --archive-async=y archive-push %p'

# WAL 级别：replica 支持归档 + 流复制；本项目单机也需要归档，故至少 replica。
# timescaledb 官方镜像默认已是 replica，此处显式声明便于审计。
wal_level = replica

# 30 秒强制切段：8.64M 行/天 持续写入下 WAL 本就不断，
# 但夜间低谷期若完全无写入，归档流会「静止」，导致 RPO 无法按时间度量。
# archive_timeout 保证最坏情况下每 30s 也有一个段被切出来归档（官方 PG 参数）。
archive_timeout = 30s

# ── 灾备端点：只允许 pgbackrest 边车连接做物理备份 ──
# 说明：pgbackrest 通过 pg1-host=timescaledb 连本实例，复用 postgres 超级用户。
# 此处不额外开 pg_hba 规则（基础 compose 已允许 docker 网段），
# 生产环境应改为专用备份用户 + 最小权限，见 DR-RUNBOOK.md「生产加固」。

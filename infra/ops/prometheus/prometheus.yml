# Prometheus scrape config (RobotMonitor ops layer)
#
# Source (item-by-item against, not fabricated):
#   - external/emqx-exporter/README.md:82-124                  EMQX 5 two-job metrics_path / honor_labels
#     (emqx-exporter scrapes the EMQX Prometheus API itself)
#   - external/emqx-exporter/examples/docker-compose/prometheus-emqx5.yaml
#                                                              job naming, cluster/from label convention, mqtt-probe section
#   - external/prometheus/config/config.go                      scrape_configs / static_configs / relabel_configs field semantics
#
# The three from labels are a hard convention of the emqx-exporter dashboard (README.md:82-124 note "fix value, don't modify"):
#   from: emqx | exporter | probe
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # ---- ① EMQX's own metrics: EMQX's built-in /api/v5/prometheus/stats ----
  # metrics_path verified: external/emqx-prometheus-sparse/apps/emqx_prometheus/src/
  #                    emqx_prometheus_api.erl:63  ("/prometheus/stats" => ?SCOPE_MONITORING)
  - job_name: 'emqx-self-metrics'
    metrics_path: /api/v5/prometheus/stats
    scrape_interval: 5s
    honor_labels: true
    static_configs:
      - targets: ['emqx:18083']
        labels:
          cluster: robot-monitor
          from: emqx

  # ---- ② emqx-exporter: the metrics EMQX's Prometheus API does not cover ----
  # Port 8085 verified: external/emqx-exporter/README.md: "listens on HTTP port 8085 by default"
  - job_name: 'exporter-metrics'
    metrics_path: /metrics
    scrape_interval: 5s
    static_configs:
      - targets: ['emqx-exporter:8085']
        labels:
          cluster: robot-monitor
          from: exporter

  # ---- ③ MQTT liveness probe: really connects once to 1883 and handshakes ----
  # This is the first probe for incidents like "the dashboard is clearly green but the robots are all offline":
  # EMQX's own reported metrics are the "server-side view"; the probe is the "client-side view" — divergence means a broker-side problem.
  - job_name: 'mqtt-probe'
    metrics_path: /probe
    params:
      target: ['emqx:1883']
    scrape_interval: 15s
    static_configs:
      - targets: ['emqx-exporter:8085']
        labels:
          cluster: robot-monitor
          from: probe

  # ---- ④ Time-series DB: postgres_exporter (TimescaleDB is PG 16) ----
  # DATA_SOURCE_NAME / metric semantics verified: external/postgres_exporter/README.md:252,316-325
  # This repo's initialization/table creation see infra/init.sql; continuous-aggregate refresh lag needs pg_stat-side
  #   observation, while /healthz's written/flushes can only prove "the backend thinks it wrote".
  - job_name: 'timescaledb'
    scrape_interval: 15s
    static_configs:
      - targets: ['postgres-exporter:9187']

  # ---- ⑤ State cache: redis_exporter ----
  # Image and port verified: external/redis_exporter/README.md:292 ("-p 9121:9121")
  - job_name: 'redis'
    scrape_interval: 15s
    static_configs:
      - targets: ['redis-exporter:9121']

  # ---- ⑥ Backend: currently *no* /metrics endpoint, so not configured ----
  # Fact: the /healthz in backend_ingestion/app/main.py:66-75 only returns JSON
  #   {status, written, flushes, queue_depth, mqtt_received, mqtt_dropped}.
  # Judgment: turning it into a time series would require introducing prometheus/client_python (one of the 14 downloaded sources)
  #   and mounting /metrics in main.py. This time we do **not** do it — AGENTS.md forbids writing unverified things in production code,
  #   and this is an order-level change that should go through a PR by the NPC. Here we only leave the probe:
  - job_name: 'backend-healthz'
    metrics_path: /probe
    params:
      module: [http_2xx]
      target: ['backend:8000/healthz']
    scrape_interval: 15s
    static_configs:
      - targets: ['blackbox-exporter:9115']
        labels:
          cluster: robot-monitor
          from: blackbox

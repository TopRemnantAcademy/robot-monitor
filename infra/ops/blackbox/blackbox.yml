# blackbox_exporter probe modules
# Source: external/blackbox_exporter/blackbox.yml (official repo default config) + README.md:33 / 76
#   /probe?target=<addr>&module=<name>, default listens on 9115 (README.md:61 "…/metrics for scraping, /probe for probing")
modules:
  # backend /healthz and EMQX Dashboard both use this
  http_2xx:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip4
      valid_status_codes: []   # empty = default 2xx
  tcp_connect:
    prober: tcp
    timeout: 5s

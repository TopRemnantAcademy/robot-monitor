# Grafana datasource auto-provisioning (provisioning)
#
# Source evidence (not copied from a blog):
#   - external/grafana-provisioning-ref/grafana/provisioning/datasources/instructor-postgres.yml
#     → how type / uid / jsonData.timescaledb / postgresVersion are written
#   - external/grafana-provisioning-ref/docker-compose.yml:26-43
#     → provisioning directory mount point /etc/grafana/provisioning (read-only)
#   - Basis for the decision: external/minio checked, and Grafana 12 only bundles these built-in
#     plugin directories: alertmanager/azuremonitor/cloudwatch/dashboard/grafana/testdata/graphite/mixed
#     (verified via GitHub API listing public/app/plugins/datasource on the main branch),
#     and does **not** include timescaledb — so TimescaleDB uses Grafana's built-in PostgreSQL datasource
#     (type: postgres), enabling TimescaleDB features via jsonData.timescaledb: true.
#     ⚠️ Unverified: whether Grafana 12's provisioning accepts the new type alias
#     `grafana-postgresql-datasource` (the reference repo uses it, and that repo pins grafana/grafana:12.3.2).
#     This repo conservatively uses the classic `postgres` first (compatible across all Grafana versions);
#     switch only if Grafana reports an unknown type.
apiVersion: 1

datasources:
  # ---- TimescaleDB (= PostgreSQL 16 + timescaledb extension, see infra/init.sql) ----
  - name: RobotMonitor-TimescaleDB
    uid: rm-timescaledb
    type: postgres
    access: proxy
    url: timescaledb:5432
    database: robot_monitor
    user: postgres
    secureJsonData:
      password: postgres
    jsonData:
      sslmode: disable
      postgresVersion: 1600      # infra/docker-compose.yml: timescale/timescaledb:2.13.1-pg16
      timescaledb: true          # enable TimescaleDB-specific capabilities (time_bucket, CAgg recognition)
    editable: true

  # ---- Prometheus (EMQX / exporter / probe / PG / Redis metrics) ----
  - name: RobotMonitor-Prometheus
    uid: rm-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    jsonData:
      timeInterval: 5s
      httpMethod: POST
    editable: true

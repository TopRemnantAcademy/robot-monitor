# Grafana dashboard auto-provisioning
# Source: external/emqx-exporter/examples/docker-compose/grafana-dashboard.yaml provider style
#   + external/prometheus/docs (provider directory mount semantics)
apiVersion: 1

providers:
  - name: 'RobotMonitor'
    orgId: 1
    folder: 'RobotMonitor'
    folderUid: 'robot-monitor'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards

# emqx-exporter config
# Source: external/emqx-exporter/examples/docker-compose/emqx-exporter.config.yaml
#   (the example uses https + tls_config.insecure_skip_verify; this repo's EMQX only opens plaintext
#   18083, so simplified to http)
# Notes (source: external/emqx-exporter/README.md:26-34):
#   the metrics section needs EMQX Dashboard's API KEY/SECRET (EMQX 5 path: Dashboard → System → API Keys).
#   The repo **cannot** ship real secrets → here we only reference env-var placeholders, injected by
#   compose from .env.
#   metrics / probes are both optional: empty = that feature is off (README.md:62).
# ⚠️ This section must explicitly choose http: EMQX 5.6 serves plaintext HTTP on 18083,
#    and the Dashboard's HTTPS listener (18084) is not opened in infra/docker-compose.yml.
metrics:
  target: emqx:18083
  scheme: http
  api_key: "${EMQX_EXPORTER_API_KEY}"
  api_secret: "${EMQX_EXPORTER_API_SECRET}"
probes:
  - target: emqx:1883

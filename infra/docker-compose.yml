version: "3.8"

services:
  emqx:
    # Image selection (re-reviewed 2026-10-10; prior conclusion corrected, see external/SOURCES.md §1.1):
    #   emqx/emqx and emqx (=library/emqx) are [the same image's two release channels] —
    #   Docker Official Images' library/emqx is built by https://github.com/emqx/emqx-docker
    #   (official-images/library/emqx explicitly states GitRepo: emqx/emqx-docker).
    #   Differing index digests are normal (different builders); it does not mean one is "non-EMQX".
    #   Verification: library/emqx:5.6 config.Env contains EMQX_VERSION=5.6.1,
    #   Entrypoint=/usr/bin/docker-entrypoint.sh, matching emqx-docker/5.6/Dockerfile line by line.
    #
    # Real reason for still choosing emqx/emqx over library/emqx: the 5.6 line is only continuously
    #   published on emqx/emqx; Docker Official Images currently only maintains 5.7 / 5.8
    #   (verified: official-images/library/emqx Tags only has these two);
    #   emqx/emqx:5.6 is the traceable source for 5.6.x.
    image: emqx/emqx:5.6
    container_name: robot-monitor-emqx
    restart: unless-stopped
    ports:
      - "1883:1883"      # MQTT
      - "18083:18083"    # Dashboard
    environment:
      EMQX_LOG__LEVEL: warning
      # Explicitly enable the Prometheus scrape endpoint (EMQX 5 defaults to true; declared here for auditability).
      # Endpoint verified: external/emqx-prometheus-sparse/apps/emqx_prometheus/src/emqx_prometheus_api.erl:63
      #   "/prometheus/stats" => ?SCOPE_MONITORING
      # Note: this is a **built-in** capability, no emqx-exporter needed; the exporter only supplements
      #   metrics it does not cover.
      # This endpoint needs no API Key (scope registry see same file :60-67, /prometheus/stats is a
      #   MONITORING read interface); Prometheus can scrape /api/v5/prometheus/stats directly —
      #   see ops/prometheus/prometheus.yml ①.
      EMQX_PROMETHEUS__ENABLE: "true"
    healthcheck:
      # `emqx ping` is EMQX's official example (external/mqtt-to-timescaledb/docker-compose.yml) usage.
      # It only works because emqx-docker's Dockerfile does
      #   `ln -s /opt/emqx/bin/* /usr/local/bin/` (verified: emqx-docker/5.6/Dockerfile),
      # so the emqx executable exists on PATH.
      # start_period must be generous: EMQX's first start unpacks the Erlang runtime, clearly slower
      #   than DB/Redis (R-07 §1 already stressed the false failure of
      #   'start the simulator as soon as DB is up → can't connect to Broker → 0 writes').
      test: ["CMD", "emqx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  timescaledb:
    image: timescale/timescaledb:2.13.1-pg16
    container_name: robot-monitor-timescaledb
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: robot_monitor
      # ------------------------------------------------------------------
      # TimescaleDB/Postgres tuning (order 21 / I-11)
      #
      # ⚠️ Important (no hallucination, stated upfront): the timescaledb official image [does not have]
      #   per-PG-parameter env vars named like
      #   TS_TUNE_SHARED_BUFFERS / TS_TUNE_MAX_CONNECTIONS.
      #   The official image entrypoint only reads these 6 TS_TUNE_* + NO_TS_TUNE (verified:
      #   timescaledb-docker/docker-entrypoint-initdb.d/001_timescaledb_tune.sh:3-8),
      #   and timescaledb-tune derives keys like shared_buffers in postgresql.conf via formulas.
      #   Therefore this task cannot 'write one same-named env per each of the 7 PG parameters' —
      #   that would be fabrication, violating order §4.2.
      #   The actual controllable paths and derivation sources for the 7 target parameters are in
      #   the per-item comments below.
      #
      # Baseline values: 16GB memory / 4 vCPU (order §2 '100 units / 16GB-class spec').
      # Set explicit values = fixed baseline, eliminating non-reproducible load-test results caused by
      #   the image's cgroup-based auto-tuning (R-08 C1 ±10%).
      # ------------------------------------------------------------------

      # Memory baseline. Semantics/source: timescaledb-docker/README.md:52-56
      #   "use the TS_TUNE_MEMORY and TS_TUNE_NUM_CPUS environment variables"
      # Affected keys (pkg/pgtune/memory.go, DefaultProfile):
      #   shared_buffers        = memory/4      → 4GB   (memory.go:60-61)
      #   effective_cache_size  = memory*3/4    → 12GB  (memory.go:62-63)
      #   maintenance_work_mem  = min(mem_GB*128MB, 2047MB) → 2GB (memory.go:16,64-69)
      #   work_mem              = f(mem,conns,cpus)         → 32MB (memory.go:70-75)
      TS_TUNE_MEMORY: "16GB"

      # CPU baseline. Source: same README.md:52-56; only affects parallels/work_mem derivation.
      #   work_mem denominator includes cpuFactor=round(cpus/2) (memory.go:71)
      TS_TUNE_NUM_CPUS: "4"

      # Max connections. Source: timescaledb-docker/README.md:65-68
      #   "use the TS_TUNE_MAX_CONNS environment variable"
      # Affected key: max_connections (pkg/pgtune/misc.go:157-161).
      # At 16GB the tuner default is already 100 (misc.go:48 MaxConnectionsDefault / :55-62 getMaxConns),
      #   pinned explicitly here to prevent drift.
      TS_TUNE_MAX_CONNS: "100"

      # Background worker count. Source: README.md:59-62
      #   "use the TS_TUNE_MAX_BG_WORKERS environment variable"
      # Affected key: timescaledb.max_background_workers (pkg/pgtune/parallel.go:10,69-70),
      #   and indirectly derives max_worker_processes = 3 + bgworkers + cpus (parallel.go:15,64).
      TS_TUNE_MAX_BG_WORKERS: "16"

      # WAL disk capacity. Source: timescaledb-tune/README.md:95
      #   `$ timescaledb-tune --wal-disk-size="10GB"`
      # Affected key: max_wal_size = wal_disk*60%/16MB ceiling (pkg/pgtune/wal.go:15,79-95),
      #   min_wal_size = max_wal_size/2 (wal.go:67-69).
      # If unset, default max_wal_size=1GB (wal.go:18 defaultMaxWALBytes).
      # Set 10GB explicitly → max_wal_size ≈ 6GB / min_wal_size ≈ 3GB, steadier write throughput.
      TS_TUNE_WAL_DISK_SIZE: "10GB"

      # Telemetry switch. Source: timescaledb-docker/README.md:31-34
      #   "set an environmental variable, TIMESCALEDB_TELEMETRY ... -e TIMESCALEDB_TELEMETRY=off"
      # Consumption point: docker-entrypoint-initdb.d/000_install_timescaledb.sh:14
      #   `if [ "${TIMESCALEDB_TELEMETRY:-}" == "off" ]`
      TIMESCALEDB_TELEMETRY: "off"

      # NO_TS_TUNE (disable tuner auto-tuning) source and trade-off notes — this task [deliberately does not set] it.
      # Source: timescaledb-docker/README.md:71-74
      #   "To not run timescaledb-tune at all, use the NO_TS_TUNE environment variable"
      # Consumption point: 001_timescaledb_tune.sh:3,10-12 (non-empty → exit 0).
      # ⚠️ Side effect: after disabling tune, these keys 'without a standalone env' below will no longer
      #   be auto-written by the tuner, and must rely on postgresql.conf.sample's PG defaults:
      #     checkpoint_completion_target → tuner runtime=0.9 (misc.go:27,132-133)
      #     random_page_cost             → tuner runtime=1.1 (misc.go:29,140-141; SSD recommended)
      #     wal_compression              → default profile has no recommended value (wal.go:142-153, only promscale=1)
      #   To keep the baseline controllable and these 3 items at recommended values, this task does [not]
      #   set NO_TS_TUNE (keep tuner running), only pinning memory/CPU/connections/WAL inputs via
      #   explicit TS_TUNE_*. Hence this line is deliberately left disabled:
      # NO_TS_TUNE: "true"
    volumes:
      - tsdb-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d robot_monitor"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: robot-monitor-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ============================================================
  # Ops/observability layer (sources: external/prometheus, external/emqx-exporter,
  #                       external/blackbox_exporter, external/postgres_exporter,
  #                       external/redis_exporter)
  #
  # Why it's needed: dashboards only answer "what do I see right now". After a load test, nobody knows
  #   - where the peak actually hit (EMQX connections / queue / PG writes / Redis RTT)
  #   - at 1000 msg/s, does the broker fail first or the backend fail first
  #   - how many messages actually dropped in the last 10 minutes (/healthz is just an instant JSON, no history)
  # This layer fills that gap. All are **optional overlays** that don't change robot-monitor's existing startup method.
  # ============================================================

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: robot-monitor-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      # Verification entry point: external/prometheus/docs/command-line/promtool.md:91
      #   `promtool check config` (not run in this repo; see PR "unverified" section)
    depends_on:
      - emqx
    profiles: ["ops"]

  emqx-exporter:
    # Port 8085 verified: external/emqx-exporter/README.md
    #   "The emqx-exporter listens on HTTP port 8085 by default."
    # tag 0.2.3 comes from the official example: external/emqx-exporter/examples/docker-compose/docker-compose.yml
    image: emqx/emqx-exporter:0.2.3
    container_name: robot-monitor-emqx-exporter
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      # Deliberately keep the placeholder value form from the example (not a production credential, not a secret):
      # See external/emqx-exporter/examples/docker-compose/bootstrap-api
      # In production, replace with the real value generated by EMQX Dashboard → System → API Keys, via .env.
      EMQX_EXPORTER_API_KEY: ${EMQX_EXPORTER_API_KEY:-replace-me}
      EMQX_EXPORTER_API_SECRET: ${EMQX_EXPORTER_API_SECRET:-replace-me}
    volumes:
      - ./ops/emqx-exporter/emqx-exporter.config.yaml:/usr/local/emqx-exporter/bin/config.yaml:ro
    depends_on:
      emqx:
        condition: service_healthy
    profiles: ["ops"]

  blackbox-exporter:
    # /probe?target=&module= and port 9115 verified: external/blackbox_exporter/README.md
    image: prom/blackbox-exporter:v0.26.0
    container_name: robot-monitor-blackbox-exporter
    restart: unless-stopped
    ports:
      - "9115:9115"
    volumes:
      - ./ops/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    profiles: ["ops"]

  postgres-exporter:
    # Purpose: turn "whether batch writes to DB are actually happening" into an observable time series
    #   (/healthz only has instant values).
    # DATA_SOURCE_NAME semantics verified: external/postgres_exporter/README.md:252,316-325
    image: prometheuscommunity/postgres-exporter:v0.17.0
    container_name: robot-monitor-postgres-exporter
    restart: unless-stopped
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@timescaledb:5432/robot_monitor?sslmode=disable"
    depends_on:
      timescaledb:
        condition: service_healthy
    profiles: ["ops"]

  redis-exporter:
    # Port 9121 verified: external/redis_exporter/README.md:292  "-p 9121:9121"
    image: oliver006/redis_exporter:v1.67.0
    container_name: robot-monitor-redis-exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: "redis://redis:6379"
    depends_on:
      - redis
    profiles: ["ops"]

  grafana:
    # ⚠️ License note: grafana/grafana and grafana/loki are **AGPL-3.0**.
    #   Using it under this repo's MIT (LICENSE) is fine, but if you later offer a modified Grafana
    #   service to others, you must meet AGPL's source-disclosure obligation. Already recorded in external/SOURCES.md.
    image: grafana/grafana:11.5.0
    container_name: robot-monitor-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Default credentials are for local dev only; production must override via .env (AGENTS.md §5: never hardcode production credentials in code)
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      # Provisioning directory structure verified: external/grafana-provisioning-ref/docker-compose.yml:40-43
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    profiles: ["ops"]

volumes:
  tsdb-data:
  prom-data:
  grafana-data:

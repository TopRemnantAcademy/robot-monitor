version: "3.8"

services:
  emqx:
    # 镜像全名必须为 emqx/emqx（EMQX 官方开源版）。
    # 实证（2026-10-10）：裸名 emqx:5.6 会解析到 Docker Hub 上的同名第三方镜像，
    #   两者 digest 完全不同 ——
    #   emqx:5.6       -> sha256:06f2341d1bf4ec8350a37a029dc5f6590c2dc95f181bebf1493d0f8e3a727f8e (非 EMQX)
    #   emqx/emqx:5.6  -> sha256:c5a4118b2dc3bc0e8b0ed877eb7c51b7d9a4a5a920c20e441d5316fa43611ce0 (官方)
    #   参考源：external/mqtt-to-timescaledb/docker-compose.yml（EMQX 官方示例仓库）
    image: emqx/emqx:5.6
    container_name: robot-monitor-emqx
    ports:
      - "1883:1883"      # MQTT
      - "18083:18083"    # Dashboard
    environment:
      EMQX_LOG__LEVEL: warning
    healthcheck:
      # 与官方示例保持一致（external/mqtt-to-timescaledb 使用 emqx ping）
      test: ["CMD", "emqx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  timescaledb:
    image: timescale/timescaledb:2.13.1-pg16
    container_name: robot-monitor-timescaledb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: robot_monitor
    volumes:
      - tsdb-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d robot_monitor"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: robot-monitor-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tsdb-data:

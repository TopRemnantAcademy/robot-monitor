version: "3.8"

services:
  emqx:
    # 镜像选型（2026-10-10 复核，此前结论已纠正，见 external/SOURCES.md §1.1）：
    #   emqx/emqx 与 emqx(=library/emqx) 是【同一个镜像的两个发布通道】——
    #   Docker Official Images 的 library/emqx 就是由 https://github.com/emqx/emqx-docker
    #   构建的（official-images/library/emqx 明文写着 GitRepo: emqx/emqx-docker）。
    #   两者 index digest 不同属正常（构建方不同），不代表其中一个是"非 EMQX"。
    #   实测 library/emqx:5.6 config.Env 含 EMQX_VERSION=5.6.1，
    #   Entrypoint=/usr/bin/docker-entrypoint.sh，与 emqx-docker/5.6/Dockerfile 逐行吻合。
    #
    # 仍选 emqx/emqx 而非 library/emqx 的真实理由：5.6 这一档只在 emqx/emqx 持续发布，
    #   Docker Official Images 当前只维护 5.7 / 5.8（实证 official-images/library/emqx
    #   的 Tags 只有这两个）；emqx/emqx:5.6 才是 5.6.x 的可追溯来源。
    image: emqx/emqx:5.6
    container_name: robot-monitor-emqx
    ports:
      - "1883:1883"      # MQTT
      - "18083:18083"    # Dashboard
    environment:
      EMQX_LOG__LEVEL: warning
      # Prometheus 拉取端点显式开启（EMQX 5 默认即为 true，此处显式声明便于审计）。
      # 端点实证：external/emqx-prometheus-sparse/apps/emqx_prometheus/src/emqx_prometheus_api.erl:63
      #   "/prometheus/stats" => ?SCOPE_MONITORING
      # 注意：这是**内置**能力，不需要 emqx-exporter；exporter 只补它没覆盖的指标。
      # 该端点无需 API Key（scope 注册表见同文件 :60-67，/prometheus/stats 属 MONITORING 读接口），
      # Prometheus 直接抓 /api/v5/prometheus/stats 即可 —— 见 ops/prometheus/prometheus.yml ①。
      EMQX_PROMETHEUS__ENABLE: "true"
    healthcheck:
      # `emqx ping` 是 EMQX 官方示例（external/mqtt-to-timescaledb/docker-compose.yml）用法，
      # 其可用的前提是 emqx-docker 的 Dockerfile 做了
      #   `ln -s /opt/emqx/bin/* /usr/local/bin/`（实证 emqx-docker/5.6/Dockerfile），
      # 故 PATH 上存在 emqx 可执行文件。
      # start_period 必须给足：EMQX 首次启动需展开 Erlang 运行时，明显慢于 DB/Redis
      # （R-07 §1 已强调「只等 DB 就开跑模拟器 → 连不上 Broker → 写入 0 条」的假失败）。
      test: ["CMD", "emqx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  timescaledb:
    image: timescale/timescaledb:2.13.1-pg16
    container_name: robot-monitor-timescaledb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: robot_monitor
      # ------------------------------------------------------------------
      # TimescaleDB/Postgres 调优（订单 21 / I-11）
      #
      # ⚠️ 重要（无幻觉，先说清）：timescaledb 官方镜像【不存在】形如
      #   TS_TUNE_SHARED_BUFFERS / TS_TUNE_MAX_CONNECTIONS 的「按 PG 参数命名」env。
      #   官方镜像 entrypoint 只读下面这 6 个 TS_TUNE_* + NO_TS_TUNE（实证：
      #   timescaledb-docker/docker-entrypoint-initdb.d/001_timescaledb_tune.sh:3-8），
      #   由 timescaledb-tune 按公式推导出 postgresql.conf 里的 shared_buffers 等键。
      #   因此本单无法「为 7 个 PG 参数各写一个同名 env」——那是臆造，违反订单 §4.2。
      #   7 个目标参数的实际可控路径与其推导来源见下方逐条注释。
      #
      # 取值基线：16GB 内存 / 4 vCPU（订单 §2「100 台 / 16GB 类规格」）。
      # 设显式值 = 固定基线，消除镜像按 cgroup 自推算导致的压测不可复现（R-08 C1 ±10%）。
      # ------------------------------------------------------------------

      # 内存基线。语义/出处：timescaledb-docker/README.md:52-56
      #   "use the TS_TUNE_MEMORY and TS_TUNE_NUM_CPUS environment variables"
      # 影响键（pkg/pgtune/memory.go，DefaultProfile）：
      #   shared_buffers        = memory/4      → 4GB   （memory.go:60-61）
      #   effective_cache_size  = memory*3/4    → 12GB  （memory.go:62-63）
      #   maintenance_work_mem  = min(mem_GB*128MB, 2047MB) → 2GB（memory.go:16,64-69）
      #   work_mem              = f(mem,conns,cpus)         → 32MB（memory.go:70-75）
      TS_TUNE_MEMORY: "16GB"

      # CPU 基线。出处同上 README.md:52-56；仅影响 parallels/work_mem 推导。
      #   work_mem 分母含 cpuFactor=round(cpus/2)（memory.go:71）
      TS_TUNE_NUM_CPUS: "4"

      # 最大连接数。出处：timescaledb-docker/README.md:65-68
      #   "use the TS_TUNE_MAX_CONNS environment variable"
      # 影响键：max_connections（pkg/pgtune/misc.go:157-161）。
      # 16GB 时 tuner 默认值本就为 100（misc.go:48 MaxConnectionsDefault / :55-62 getMaxConns），
      # 此处显式钉死防漂移。
      TS_TUNE_MAX_CONNS: "100"

      # 后台 worker 数。出处：README.md:59-62
      #   "use the TS_TUNE_MAX_BG_WORKERS environment variable"
      # 影响键：timescaledb.max_background_workers（pkg/pgtune/parallel.go:10,69-70），
      #   并间接推导 max_worker_processes = 3 + bgworkers + cpus（parallel.go:15,64）。
      TS_TUNE_MAX_BG_WORKERS: "16"

      # WAL 所在磁盘容量。出处：timescaledb-tune/README.md:95
      #   `$ timescaledb-tune --wal-disk-size="10GB"`
      # 影响键：max_wal_size = wal_disk*60%/16MB 上取整（pkg/pgtune/wal.go:15,79-95），
      #   min_wal_size = max_wal_size/2（wal.go:67-69）。
      # 不设时默认 max_wal_size=1GB（wal.go:18 defaultMaxWALBytes）。
      # 显式给 10GB → max_wal_size ≈ 6GB / min_wal_size ≈ 3GB，写吞吐更稳。
      TS_TUNE_WAL_DISK_SIZE: "10GB"

      # 遥测开关。出处：timescaledb-docker/README.md:31-34
      #   "set an environmental variable, TIMESCALEDB_TELEMETRY ... -e TIMESCALEDB_TELEMETRY=off"
      # 消费点：docker-entrypoint-initdb.d/000_install_timescaledb.sh:14
      #   `if [ "${TIMESCALEDB_TELEMETRY:-}" == "off" ]`
      TIMESCALEDB_TELEMETRY: "off"

      # NO_TS_TUNE（关闭 tuner 自调优）的出处与取舍说明——本单【故意不设】它。
      # 出处：timescaledb-docker/README.md:71-74
      #   "To not run timescaledb-tune at all, use the NO_TS_TUNE environment variable"
      # 消费点：001_timescaledb_tune.sh:3,10-12（非空即 exit 0）。
      # ⚠️ 副作用：关掉 tune 后，下面这些「没有独立 env」的键将不再由 tuner 自动写入，
      #   需依赖 postgresql.conf.sample 的 PG 默认值：
      #     checkpoint_completion_target → tuner 运行时=0.9（misc.go:27,132-133）
      #     random_page_cost             → tuner 运行时=1.1（misc.go:29,140-141；SSD 推荐）
      #     wal_compression              → 默认 profile 无推荐值（wal.go:142-153，仅 promscale=1）
      #   为保证基线可控且这 3 项达到推荐值，本单【不】设 NO_TS_TUNE（保持 tuner 运行），
      #   仅以显式 TS_TUNE_* 钉住内存/CPU/连接数/WAL 四项输入。故此行故意不启用：
      # NO_TS_TUNE: "true"
    volumes:
      - tsdb-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d robot_monitor"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: robot-monitor-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ============================================================
  # 运维/可观测性层（sources: external/prometheus, external/emqx-exporter,
  #                       external/blackbox_exporter, external/postgres_exporter,
  #                       external/redis_exporter）
  #
  # 为什么必需：看板只能回答「我现在看到什么」。压测跑完谁都不知道
  #   - 峰值到底打在哪一层（EMQX 连接数 / 队列 / PG 写入 / Redis RTT）
  #   - 1000 msg/s 是 broker 先扛不住还是后端先扛不住
  #   - 过去 10 分钟到底掉了几条（/healthz 只是一个瞬时 JSON，没有历史）
  # 这一层就是把这个空白补上。全部为**可选叠加**，不改变 robot-monitor 的既有启动方式。
  # ============================================================

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: robot-monitor-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      # 校验入口实证：external/prometheus/docs/command-line/promtool.md:91
      #   `promtool check config`（本仓库未跑，见 PR「未验证」章节）
    depends_on:
      - emqx
    profiles: ["ops"]

  emqx-exporter:
    # 端口 8085 实证：external/emqx-exporter/README.md
    #   "The emqx-exporter listens on HTTP port 8085 by default."
    # tag 0.2.3 来自官方示例：external/emqx-exporter/examples/docker-compose/docker-compose.yml
    image: emqx/emqx-exporter:0.2.3
    container_name: robot-monitor-emqx-exporter
    ports:
      - "8085:8085"
    environment:
      # 刻意保留示例里的占位值形态（不是生产凭据，也不是秘密）：
      # 见 external/emqx-exporter/examples/docker-compose/bootstrap-api
      # 正式部署换成 EMQX Dashboard → System → API Keys 生成的真实值，走 .env。
      EMQX_EXPORTER_API_KEY: ${EMQX_EXPORTER_API_KEY:-replace-me}
      EMQX_EXPORTER_API_SECRET: ${EMQX_EXPORTER_API_SECRET:-replace-me}
    volumes:
      - ./ops/emqx-exporter/emqx-exporter.config.yaml:/usr/local/emqx-exporter/bin/config.yaml:ro
    depends_on:
      emqx:
        condition: service_healthy
    profiles: ["ops"]

  blackbox-exporter:
    # /probe?target=&module= 与 9115 端口实证：external/blackbox_exporter/README.md
    image: prom/blackbox-exporter:v0.26.0
    container_name: robot-monitor-blackbox-exporter
    ports:
      - "9115:9115"
    volumes:
      - ./ops/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    profiles: ["ops"]

  postgres-exporter:
    # 用途：把「批量落库是否真的在写」变成可观测的时间序列（/healthz 只有瞬时值）。
    # DATA_SOURCE_NAME 语义实证：external/postgres_exporter/README.md:252,316-325
    image: prometheuscommunity/postgres-exporter:v0.17.0
    container_name: robot-monitor-postgres-exporter
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@timescaledb:5432/robot_monitor?sslmode=disable"
    depends_on:
      timescaledb:
        condition: service_healthy
    profiles: ["ops"]

  redis-exporter:
    # 端口 9121 实证：external/redis_exporter/README.md:292  "-p 9121:9121"
    image: oliver006/redis_exporter:v1.67.0
    container_name: robot-monitor-redis-exporter
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: "redis://redis:6379"
    depends_on:
      - redis
    profiles: ["ops"]

  grafana:
    # ⚠️ License 提醒：grafana/grafana 与 grafana/loki 为 **AGPL-3.0**。
    #   本仓库 MIT（LICENSE）下「调用」它没问题，但若将来对外提供修改版 Grafana 服务，
    #   需承担 AGPL 的源码开放义务。已记录在 external/SOURCES.md。
    image: grafana/grafana:11.5.0
    container_name: robot-monitor-grafana
    ports:
      - "3000:3000"
    environment:
      # 默认口令只用于本地开发；生产必须从 .env 覆盖（AGENTS.md §5：不在代码里硬编码生产凭据）
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      # 供给目录结构实证：external/grafana-provisioning-ref/docker-compose.yml:40-43
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    profiles: ["ops"]

volumes:
  tsdb-data:
  prom-data:
  grafana-data:

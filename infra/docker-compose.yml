version: "3.8"

services:
  emqx:
    # 镜像选型（2026-10-10 复核，此前结论已纠正，见 external/SOURCES.md §1.1）：
    #   emqx/emqx 与 emqx(=library/emqx) 是【同一个镜像的两个发布通道】——
    #   Docker Official Images 的 library/emqx 就是由 https://github.com/emqx/emqx-docker
    #   构建的（official-images/library/emqx 明文写着 GitRepo: emqx/emqx-docker）。
    #   两者 index digest 不同属正常（构建方不同），不代表其中一个是"非 EMQX"。
    #   实测 library/emqx:5.6 config.Env 含 EMQX_VERSION=5.6.1，
    #   Entrypoint=/usr/bin/docker-entrypoint.sh，与 emqx-docker/5.6/Dockerfile 逐行吻合。
    #
    # 仍选 emqx/emqx 而非 library/emqx 的真实理由：5.6 这一档只在 emqx/emqx 持续发布，
    #   Docker Official Images 当前只维护 5.7 / 5.8（实证 official-images/library/emqx
    #   的 Tags 只有这两个）；emqx/emqx:5.6 才是 5.6.x 的可追溯来源。
    image: emqx/emqx:5.6
    container_name: robot-monitor-emqx
    ports:
      - "1883:1883"      # MQTT
      - "18083:18083"    # Dashboard
    environment:
      EMQX_LOG__LEVEL: warning
    healthcheck:
      # `emqx ping` 是 EMQX 官方示例（external/mqtt-to-timescaledb/docker-compose.yml）用法，
      # 其可用的前提是 emqx-docker 的 Dockerfile 做了
      #   `ln -s /opt/emqx/bin/* /usr/local/bin/`（实证 emqx-docker/5.6/Dockerfile），
      # 故 PATH 上存在 emqx 可执行文件。
      # start_period 必须给足：EMQX 首次启动需展开 Erlang 运行时，明显慢于 DB/Redis
      # （R-07 §1 已强调「只等 DB 就开跑模拟器 → 连不上 Broker → 写入 0 条」的假失败）。
      test: ["CMD", "emqx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  timescaledb:
    image: timescale/timescaledb:2.13.1-pg16
    container_name: robot-monitor-timescaledb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: robot_monitor
    volumes:
      - tsdb-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d robot_monitor"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: robot-monitor-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tsdb-data:

[pytest]

# WARNING: Without this file, running `pytest` at the repo root would try to
# collect the downloaded third-party source under external/ (prometheus
# client_python / paho.mqtt.python / redis-py / starlette / ...), which in
# practice produced 61 collection errors and aborted, so you could not tell
# whether the repo's OWN tests passed. external/ is reference source (~58 MB),
# excluded by .gitignore and must never be treated as the repo's tests.
testpaths =
    tests
    alert_engine/tests

# WARNING: backend_ingestion/tests is deliberately NOT listed above. This repo
# has two top-level packages named `app` (backend_ingestion/app and
# alert_engine/app); within a single pytest process sys.modules["app"] can only
# resolve to one location, so collecting both at once collides
# (observed: ModuleNotFoundError: No module named 'app.rules').
# Run the backend suite separately (each command is fully green on its own; see
# tests/README):
#     pytest backend_ingestion/tests/
# The proper fix is renaming the top-level packages, which is a cross-module
# refactor and out of scope for order 15.

norecursedirs =
    external
    node_modules
    .venv
    .venv-ci
    .venv*
    venv
    dist
    build
    frontend_dashboard
    infra
    reports
    .git

# Repo convention: test_*.py must contain real test_* functions.
# Pure scripts (e.g. backend_ingestion/tests/verify_*.py) are NOT named
# test_*.py; see the header comment in those files.
python_files = test_*.py

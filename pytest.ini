[pytest]

# ⚠️ 没有本文件时，在仓库根跑 `pytest` 会去收集 external/ 下**下载的第三方源码**
# （prometheus client_python / paho.mqtt.python / redis-py / starlette / ...），
# 实测产生 61 个 collection error 并中断，导致「本仓自己的测试到底过了没有」看不出来。
# external/ 是参考源（58 MB），按 .gitignore 不入库，也绝不能被当作本仓测试。
testpaths =
    tests
    alert_engine/tests
    backend_ingestion/tests

norecursedirs =
    external
    node_modules
    .venv
    .venv-ci
    .venv*
    venv
    dist
    build
    frontend_dashboard
    infra
    reports
    .git

# 本仓约定：test_*.py 必须含真实 test_* 函数。
# 纯脚本（如 backend_ingestion/tests/verify_*.py）不叫 test_*.py，见该文件头注释。
python_files = test_*.py
